<script>
/* SCMIO — SCMリカレント教育ツール共通の入出力モジュール
 * ・Excel（.xlsx）の読み込み・書き出し（外部ライブラリなし。ブラウザ標準の DecompressionStream を使う）
 * ・CSV の読み込み（UTF-8／Shift_JIS 自動判定）・書き出し
 * ・ツール間の受け渡し（同じブラウザ内：localStorage／開いたウィンドウ：postMessage）
 * データは端末の外へ一切送らない。
 * このファイルは src/scm-io.js が原本。build.py が各ツールの <!-- SCMIO:BEGIN --> 〜 <!-- SCMIO:END --> に埋め込む。
 */
(function (root) {
  'use strict';
  var VERSION = '1.0.0';

  /* ---------- ZIP（読み） ---------- */
  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }

  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') throw new Error('このブラウザは xlsx の展開に対応していません（Chrome・Edge・Firefox・Safari の最新版を使ってください）');
    var ds = new DecompressionStream('deflate-raw');
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unzip(buf) {
    var b = new Uint8Array(buf), eocd = -1;
    for (var i = b.length - 22; i >= Math.max(0, b.length - 65557); i--) {
      if (u32(b, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('xlsx（ZIP）として読めません。Excel で「名前を付けて保存 → Excel ブック（.xlsx）」で保存し直してください');
    var n = u16(b, eocd + 10), p = u32(b, eocd + 16), files = {}, dec = new TextDecoder('utf-8');
    for (var k = 0; k < n; k++) {
      if (u32(b, p) !== 0x02014b50) break;
      var method = u16(b, p + 10), csize = u32(b, p + 20), nl = u16(b, p + 28), xl = u16(b, p + 30), cl = u16(b, p + 32), lho = u32(b, p + 42);
      var name = dec.decode(b.subarray(p + 46, p + 46 + nl));
      files[name] = { method: method, csize: csize, lho: lho };
      p += 46 + nl + xl + cl;
    }
    return {
      names: Object.keys(files),
      has: function (nm) { return !!files[nm]; },
      text: async function (nm) {
        var f = files[nm]; if (!f) return null;
        var s = f.lho + 30 + u16(b, f.lho + 26) + u16(b, f.lho + 28);
        var raw = b.subarray(s, s + f.csize);
        var out = f.method === 0 ? raw : f.method === 8 ? await inflateRaw(raw) : null;
        if (!out) throw new Error('未対応の圧縮方式です: ' + nm);
        return dec.decode(out);
      }
    };
  }

  /* ---------- xlsx（読み） ---------- */
  function xml(s) { return new DOMParser().parseFromString(s, 'application/xml'); }
  function kids(el, tag) { var r = [], c = el ? el.childNodes : []; for (var i = 0; i < c.length; i++) if (c[i].localName === tag) r.push(c[i]); return r; }
  function all(doc, tag) { return Array.prototype.slice.call(doc.getElementsByTagNameNS('*', tag)); }
  function textOf(el) {
    // <si> / <is> は <t> と <r><t> の連結。<rPh>（ふりがな）は除く
    var s = '';
    (function walk(n) {
      for (var i = 0; i < n.childNodes.length; i++) {
        var c = n.childNodes[i];
        if (c.localName === 'rPh') continue;
        if (c.localName === 't') s += c.textContent; else if (c.nodeType === 1) walk(c);
      }
    })(el);
    return s;
  }
  function colIndex(ref) { var m = /^([A-Z]+)(\d+)$/.exec(ref); if (!m) return null; var c = 0; for (var i = 0; i < m[1].length; i++) c = c * 26 + (m[1].charCodeAt(i) - 64); return { c: c - 1, r: +m[2] - 1 }; }
  var BUILTIN_DATE = { 14: 1, 15: 1, 16: 1, 17: 1, 18: 2, 19: 2, 20: 2, 21: 2, 22: 1, 27: 1, 28: 1, 29: 1, 30: 1, 31: 1, 32: 2, 33: 2, 34: 2, 35: 2, 36: 1, 45: 2, 46: 2, 47: 2, 50: 1, 51: 1, 52: 1, 53: 1, 54: 1, 55: 1, 56: 1, 57: 1, 58: 1 };
  function isDateFmt(code) {
    var s = code.replace(/"[^"]*"/g, '').replace(/\[(?!h\]|m\]|s\])[^\]]*\]/gi, '').replace(/\\./g, '');
    return /[ymdhsge]/i.test(s) && !/^[#0.,%E+\- ]*$/.test(s) ? (/[ymdge]/i.test(s) ? 1 : 2) : 0;

    var d = new Date(ms), iso = d.toISOString();
    if (kind === 2 && v < 1) return iso.substr(11, 8);
    if (d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0) return iso.substr(0, 10);
    return iso.substr(0, 10) + ' ' + iso.substr(11, 8);
  }

  async function readXlsx(buf) {
    var z = await unzip(buf);
    if (!z.has('xl/workbook.xml')) throw new Error('Excel ブック（.xlsx）ではありません。古い .xls は Excel で .xlsx に保存し直してください');
    var wb = xml(await z.text('xl/workbook.xml'));
    var date1904 = all(wb, 'workbookPr').some(function (e) { var v = e.getAttribute('date1904'); return v === '1' || v === 'true'; });
    var rels = {}, relsTxt = await z.text('xl/_rels/workbook.xml.rels');
    if (relsTxt) all(xml(relsTxt), 'Relationship').forEach(function (r) { rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
    var sst = [], sstTxt = await z.text('xl/sharedStrings.xml');
    if (sstTxt) sst = all(xml(sstTxt), 'si').map(textOf);
    var styleKind = [], stTxt = await z.text('xl/styles.xml');
    if (stTxt) {
      var st = xml(stTxt), custom = {};
      all(st, 'numFmt').forEach(function (f) { custom[f.getAttribute('numFmtId')] = isDateFmt(f.getAttribute('formatCode') || ''); });
      var xfs = all(st, 'cellXfs')[0];
      kids(xfs, 'xf').forEach(function (x) { var id = +x.getAttribute('numFmtId'); styleKind.push(id in custom ? custom[id] : (BUILTIN_DATE[id] || 0)); });
    }

    for (var s of all(wb, 'sheet')) {
      var rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      var target = rels[rid] || ''; target = target.replace(/^\/?xl\//, '').replace(/^\//, '');
      var path = 'xl/' + target, txt = await z.text(path);
      if (!txt) continue;
      var doc = xml(txt), rows = [];
      all(doc, 'row').forEach(function (rEl, ri) {
        var rIdx = rEl.getAttribute('r') ? +rEl.getAttribute('r') - 1 : ri, row = rows[rIdx] = [];
        kids(rEl, 'c').forEach(function (c, ci) {
          var pos = c.getAttribute('r') ? colIndex(c.getAttribute('r')) : { c: ci };
          var t = c.getAttribute('t') || 'n', vEl = kids(c, 'v')[0], v = vEl ? vEl.textContent : null, val = null;
          if (t === 's') val = v == null ? null : sst[+v];
          else if (t === 'inlineStr') { var is = kids(c, 'is')[0]; val = is ? textOf(is) : ''; }
          else if (t === 'str') val = v;
          else if (t === 'b') val = v === '1';
          else if (t === 'e') val = null;
          else if (t === 'd') val = v;

          }
          row[pos.c] = val;
        });
      });
      for (var i = 0; i < rows.length; i++) { if (!rows[i]) rows[i] = []; for (var j = 0; j < rows[i].length; j++) if (rows[i][j] === undefined) rows[i][j] = null; }
      sheets.push({ name: s.getAttribute('name'), rows: rows });
    }
    return sheets;
  }

  /* ---------- CSV ---------- */

function imJS(eq){const s=String(eq).replace(/\[([^\]]+)\]/g,(m,n)=>'V['+JSON.stringify(n)+']').replace(/\b(Days|Years|Minutes|Months|Weeks)\(\)/g,'t')
  .replace(/IfThenElse\(/g,'ITE(').replace(/\bMin\(/g,'Math.min(').replace(/\bMax\(/g,'Math.max(').replace(/\band\b/g,'&&').replace(/\bor\b/g,'||').replace(/([^<>=!])=([^=])/g,'$1==$2');
  return new Function('V','t','ITE','return ('+s+');');}
const ITE=(c,a,b)=>c?a:b;
const refsOf=eq=>[...String(eq).matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);
// L: {T,dt,U,IU, P:[{n,v,mn,mx,st,u,x,y,note}], S:[{n,init,u,x,y,note}], A:[{n,eq,u,x,y,note}], F:[{n,from,to,eq,u,pt,note}]}
function lesSim(L,pv){const n=Math.round(L.T/L.dt),V={},R={t:[]};const names=[...L.P.map(p=>p.n),...L.S.map(s=>s.n),...L.A.map(a=>a.n),...L.F.map(f=>f.n)];names.forEach(k=>R[k]=[]);
  L.P.forEach(p=>V[p.n]=pv[p.n]);const fA=L.A.map(a=>imJS(a.eq)),fF=L.F.map(f=>imJS(f.eq));
  L.S.forEach(s=>V[s.n]=typeof s.init==='number'?s.init:imJS(s.init)(V,0,ITE));
  for(let k=0;k<=n;k++){const t=+(k*L.dt).toFixed(6);L.A.forEach((a,i)=>V[a.n]=fA[i](V,t,ITE));L.F.forEach((f,i)=>V[f.n]=fF[i](V,t,ITE));
    R.t.push(t);names.forEach(nm=>R[nm].push(V[nm]));if(k<n){const d={};L.S.forEach(s=>d[s.n]=0);L.F.forEach(f=>{if(f.to)d[f.to]+=V[f.n];if(f.from)d[f.from]-=V[f.n];});L.S.forEach(s=>V[s.n]+=d[s.n]*L.dt);}}
  return R;}
function lesBuild(L,pv){const W=IMWriter(L.imTitle||L.title,L.T,L.dt,L.IU);
  L.P.forEach(p=>W.v(p.n,pv[p.n],p.x,p.y,(p.note||'')+(p.u?`（単位：${p.u}）`:''),[p.mn,p.mx,p.st]));
  L.S.forEach(s=>W.s(s.n,s.init,s.x,s.y,(s.note||'')+(s.u?`（単位：${s.u}）`:'')));
  L.A.forEach(a=>W.v(a.n,a.eq,a.x,a.y,(a.note||'')+(a.u?`（単位：${a.u}）`:'')));
  L.F.forEach(f=>W.f(f.n,f.eq,f.from||null,f.to||null,(f.note||'')+(f.u?`（単位：${f.u}）`:''),f.pt));
  const usesIn=(eq,who)=>refsOf(eq).forEach(r=>W.l(r,who));L.S.forEach(s=>typeof s.init!=='number'&&usesIn(s.init,s.n));L.A.forEach(a=>usesIn(a.eq,a.n));L.F.forEach(f=>usesIn(f.eq,f.n));
  (L.disp||[]).forEach(([n,ps])=>W.d(n,ps));return W;}

  `まず<b>たまる量</b>を探す。<b>時間を止めて写真を撮っても数えられるもの</b>がストック。浴槽の「水量」は写真で測れる（いま80L）。「給水」は写真では測れない（1分あたり何Lかは，時間が流れて初めて分かる）。<br>→ <b>水量</b>をストック（箱）にする。`,
  `次に<b>ストックを変える流れ</b>を付ける。水量を変えられるのは，<b>入る水（給水）と出る水（排水）だけ</b>。CLDで水量に向かっていた矢印（給水 →＋，排水 →−）は，SDでは<b>太い管（フロー）</b>になる。−の矢印は「出ていく管」になる。<br>雲のマークは「モデルの外」（水道・下水）。`,
  `最後に，<b>流れの速さを決めるもの</b>を置く。給水は蛇口の開き（人が決める＝<b>定数</b>）で決まる。排水は「水量」と「栓の太さ」で決まる。CLDにはなかった<b>排水にかかる時間</b>（何分で流れきるか）が，SDでは必要になる。細い矢印（リンク）は「この値を使って計算する」という印。`,
  `式と単位を確かめる。<b>排水 ＝ 水量 ÷ 排水にかかる時間</b>：L ÷ 分 ＝ L/分 で，フローの単位になっている。<b>単位がそろわない式は，どこかが間違っている</b>（これがSDのいちばん簡単な検算）。<br>釣り合うのは 給水 ＝ 排水 のとき：10 L/分 ＝ 水量 ÷ 10分 → <b>水量 100 L</b>。③で本当にそうなるか動かしてみる。`],
 quiz:{q:'空の浴槽に，蛇口を開けたまま，栓も抜いたままにしておく（給水 10 L/分，排水にかかる時間 10分）。水量はどうなる？',o:['増え続けて，いつかあふれる','ある量（100 L）に近づいて，そこで止まる','増えたり減ったりを繰り返す'],a:1,
  exp:'水が増えるほど排水も速くなり，<b>給水 ＝ 排水</b>になったところで止まる（B ループの「釣り合い」）。止まる水量は 給水量 × 排水にかかる時間 ＝ 100 L。近づき方は最初が速く，だんだんゆっくりになる。<b>排水にかかる時間</b>を20分にすると，止まる量は200 Lになり，止まるまでの時間も長くなる。'},
 presets:[['基本（給水10・排水10分）',{}],['蛇口を2倍に開く',{'蛇口からの給水量':20}],['栓を細くする（20分）',{'排水にかかる時間':20}],['満水から蛇口を閉める',{'蛇口からの給水量':0,'初期水量':200}]],
 after:'<b>実務に置きかえると</b>：倉庫の在庫（入荷・出荷），口座の残高（入金・出金），受注残（受注・生産）は，どれも同じ形のストックとフロー。「在庫を減らしたい」なら，在庫そのものではなく<b>入る流れか出る流れ</b>を変えるしかない。',
 bridge:'ブルーマウンテン社のモデル（④）では，DC在庫・受注残・生産待ちが，この浴槽と同じ「ストック」。'});

defLesson({id:'sd2',title:'SD入門2 人口（生まれる・亡くなる）：自分を増やすループ R',T:100,dt:1,U:'年',IU:'Years',

 steps:[`CLDには2つのループがある。<b>人口 → 出生 → 人口</b>（−が0個）は <b>R：自分を増やすループ</b>。<b>人口 → 死亡 → 人口</b>（−が1個）は <b>B：釣り合おうとするループ</b>。<br>CLDだけでは<b>どちらが強いか</b>が分からないので，人口が増えるのか減るのか言えない。`,
  `写真を撮って数えられるのは<b>人口</b>（いま100万人）。出生・死亡は「1年あたり何人」なので写真では数えられない。→ 人口がストック。`,
  `人口を変えるのは<b>生まれる人（出生）</b>と<b>亡くなる人（死亡）</b>だけ。どちらも太い管（フロー）にする。浴槽と同じ形で，違うのは<b>給水（出生）が水量（人口）で決まる</b>点。`,
  `出生の速さは「人口 × 出生率」，死亡の速さは「人口 ÷ 平均寿命」。リンクを見ると，<b>人口から出生へ</b>線が戻っている。これが R ループ（利息が元本に入って利息が増える，複利の預金と同じ形）。`,
  `単位：出生 ＝ 万人 × ％/年 ÷ 100 ＝ 万人/年，死亡 ＝ 万人 ÷ 年 ＝ 万人/年。どちらもフローの単位でそろう。<br><b>勝ち負けの計算</b>：出生は人口の3％/年，死亡は人口の 1/50 ＝ 2％/年。差の <b>＋1％/年</b> ずつ増える。③で確かめる。`],
 quiz:{q:'出生率 3％/年，平均寿命 50年（毎年 人口の2％が亡くなる）。100年後の人口はどうなる？',o:['ずっと同じ（100万人）','毎年同じ数ずつ増える（直線）','増え方がだんだん大きくなる（倍々）'],a:2,
  exp:'毎年「人口の1％」ずつ増えるので，人口が増えるほど増える数も大きくなる（R ループ：<b>指数的な成長</b>）。100年で約2.7倍（1.01の100乗）。平均寿命を 33年（毎年約3％が亡くなる）にすると出生と死亡がほぼ釣り合って横ばい，25年にすると減り続ける。<b>R と B のどちらが勝つか</b>で形が変わる。'},
 presets:[['基本（出生3％・寿命50年）',{}],['ほぼ釣り合う（寿命33年）',{'平均寿命':33}],['減っていく（出生1.5％）',{'出生率':1.5}],['出生率を倍に（6％）',{'出生率':6}]],
 after:'<b>実務に置きかえると</b>：口コミで広がる製品（使う人が多いほど新しい人が増える），借入の利息（残高が多いほど利息が増える）も同じ R の形。<b>R は放っておくと加速する</b>ので，小さいうちに気づくことが大事。',
 bridge:'ブルーマウンテン社の「受注残が多い → 特急便・欠品対応に追われる → さらに遅れる」も，R ループの形（システム分析ナビの R1・R2）。'});

defLesson({id:'sd3',title:'SD入門3 人口と収容力（S字）：成長の限界',T:100,dt:1,U:'年',IU:'Years',

 map:[['人口','人口',1,'ストック（SD入門2と同じ）'],['出生','出生',2,'人口に入るフロー'],['死亡','死亡',2,'人口から出るフロー'],['混み具合','混み具合',3,'その時点の人口と収容力から計算する → 補助変数（たまらない）'],['収容力','収容力',3,'外から与える条件 → 定数']],
 steps:[`ループは3本。<b>R</b>：人口 → 出生 → 人口。<b>B</b>：人口 → 死亡 → 人口。<b>B</b>：人口 → 混み具合 → 出生 → 人口（−が1個）。<br>CLDでは「はじめは R，やがて B」と<b>主役が入れかわる</b>ことは描けない。SDで「いつ入れかわるか」を見る。`,
  `ストックは<b>人口</b>だけ。<b>混み具合</b>は写真を撮れば計算できるが，「たまる」ものではない（人口が決まれば，その場で決まる）。だからストックではない。`,
  `フローは出生と死亡（SD入門2と同じ）。`,
  `<b>混み具合 ＝ 人口 ÷ 収容力</b>は，その時点で計算する<b>補助変数</b>（丸）。出生の式に「× (1 − 混み具合)」を掛け，混むほど生まれる人が減るようにする。CLDの「混み具合 → 出生 −」を，<b>どれだけ減るか</b>まで決めたのがこの式。`,
  `単位：混み具合 ＝ 万人 ÷ 万人 ＝ 比（単位なし）なので，(1 − 混み具合) は「出生率の何割が残るか」。<br>落ち着くのは 出生 ＝ 死亡 のとき：10％ × (1 − 混み具合) ＝ 2％ → 混み具合 0.8 → <b>人口 800万人</b>（収容力そのものではない点に注意）。`],
 quiz:{q:'はじめは人口10万人。最初は倍々で増える。そのあとはどうなる？',o:['倍々のまま増え続ける','あるところで頭打ちになる（S字）','収容力を超えてから急に減る'],a:1,
  exp:'人口が少ないうちは R（出生）が勝って倍々に増える。混んでくると出生が減り，B が勝って<b>出生 ＝ 死亡</b>のところ（約800万人）で頭打ちになる。グラフの<b>「出生」が山になる時点</b>が，主役が R から B に入れかわった時点。収容力を2倍にしても，同じS字で上限が上がるだけ。'},

  `流れは3本：<b>発注</b>（輸送中に入る），<b>入荷</b>（輸送中から在庫へ），<b>出荷</b>（在庫から出る）。発注しても在庫は増えない。増えるのは<b>入荷したとき</b>。ここが遅れの正体。`,
  `発注を決めるのは「需要の分」と「不足を埋める分（在庫の不足 ÷ 調整時間）」。入荷は「輸送中 ÷ リードタイム」（平均8日で届く）。<br><b>輸送中も数える</b>を1にすると，「もう頼んだけれど届いていない分」も発注で考える。0のままだと，届く前の注文を忘れて，同じ不足に<b>何度も発注</b>してしまう。`,

const NORMP=p=>{p=(p||'').trim().replace('＋','+').replace(/[－−ー‐–]/,'-');return p==='+'||p==='-'?p:'?';};
const ARW=/^(.+?)\s*(?:→|->|⇒)\s*(.+?)\s+([+\-＋－−×xX])\s*(‖|\|\||遅れ)?\s*$/;
function parseCLD(src){const same={};(src.same||'').split(/\r?\n/).forEach(l=>{const m=l.split(/[=＝]/);if(m.length===2&&m[0].trim()&&m[1].trim())same[m[0].trim()]=m[1].trim();});
  const uni=n=>{let k=0;while(same[n]&&k++<9)n=same[n];return n;};const E=[],cut=new Set();let who='',dn='';
  (src.docs||'').split(/\r?\n/).forEach(l=>{const t=l.trim();const h=t.match(/^##\s*(.+?)(?:\s*@\s*(.+))?$/);if(h){dn=h[1].trim();who=(h[2]||'').trim();return;}const a=t.match(ARW);if(a){const c=uni(a[1].trim()),e=uni(a[2].trim());if(c!==e)E.push({c,e,p:NORMP(a[3]),d:!!a[4],src:dn});}});
  (src.bridge||'').split(/\r?\n/).forEach(l=>{const [ar]=l.trim().split(/\s*[@＠]\s*/);const a=(ar||'').match(ARW);if(!a)return;const c=uni(a[1].trim()),e=uni(a[2].trim());if(/^[×xX]$/.test(a[3])){cut.add(c+'|'+e);return;}if(c!==e)E.push({c,e,p:NORMP(a[3]),d:!!a[4],src:'補った矢印'});});
  const seen=new Set();return E.filter(e=>{if(cut.has(e.c+'|'+e.e))return false;const k=e.c+'|'+e.e;if(seen.has(k))return false;seen.add(k);return true;});}
function findLoops(E){const V=[...new Set(E.flatMap(e=>[e.c,e.e]))],ix={};V.forEach((v,i)=>ix[v]=i);const adj=V.map(()=>[]);E.forEach(e=>adj[ix[e.c]].push(e));const out=[],seen=new Set();
  for(let s=0;s<V.length&&out.length<60;s++)(function dfs(u,path,vis){for(const e of adj[u]){const v=ix[e.e];if(v===s){const p=path.concat([e]);const k=p.map(x=>x.c+'>'+x.e).sort().join();if(!seen.has(k)){seen.add(k);out.push(p);}}else if(v>s&&!vis.has(v)&&path.length<14){vis.add(v);dfs(v,path.concat([e]),vis);vis.delete(v);}}})(s,[],new Set([s]));

// ===== InsightMaker のファイルを読み込む（自分で作ったモデルの答え合わせ）・draw.io に書き出す =====
function parseIM(text){const doc=new DOMParser().parseFromString(text,'text/xml');if(doc.querySelector('parsererror'))throw new Error('XMLとして読めない');
  const P=[];const byId={};const tag={Stock:'stock',Flow:'flow',Variable:'var',Converter:'conv',Link:'link',Text:'text'};
  doc.querySelectorAll('root > *').forEach(el=>{const k=tag[el.tagName];if(!k)return;const cell=el.querySelector('mxCell');const g=cell&&cell.querySelector('mxGeometry');const id=el.getAttribute('id');
    const p={kind:k,id,name:el.getAttribute('name')||'',note:el.getAttribute('Note')||'',x:g?+g.getAttribute('x')||0:0,y:g?+g.getAttribute('y')||0:0,w:g?+g.getAttribute('width')||120:120,h:g?+g.getAttribute('height')||50:50,
      eq:k==='stock'?el.getAttribute('InitialValue'):k==='flow'?el.getAttribute('FlowRate'):k==='var'?el.getAttribute('Equation'):k==='conv'?'（時刻ごとのデータ表）':'',data:el.getAttribute('Data')||'',
      role:k==='var'?(el.getAttribute('ShowSlider')==='true'?'param':'calc'):k==='conv'?'data':k,sl:el.getAttribute('ShowSlider')==='true'?[el.getAttribute('SliderMin'),el.getAttribute('SliderMax')]:null,
      _s:cell&&cell.getAttribute('source'),_t:cell&&cell.getAttribute('target')};
    if(k==='flow'&&g){const sp=g.querySelector('mxPoint[as="sourcePoint"]')||g.querySelector('mxPoint[as="targetPoint"]');if(sp)p.pt=[+sp.getAttribute('x')||0,+sp.getAttribute('y')||0];}
    byId[id]=p;P.push(p);});
  P.forEach(p=>{if(p.kind==='flow'){p.src=p._s&&byId[p._s]?byId[p._s].name:null;p.tgt=p._t&&byId[p._t]?byId[p._t].name:null;}if(p.kind==='link'){p.a=byId[p._s]&&byId[p._s].name;p.b=byId[p._t]&&byId[p._t].name;}});
  return{P:P.filter(p=>p.kind!=='link'||(p.a&&p.b)),secOf:null,title:'読み込んだモデル'};}
const normEq=s=>String(s||'').replace(/\s+/g,'').replace(/[［]/g,'[').replace(/[］]/g,']').toLowerCase();
function compareIM(A,B){// A=答え（このツール），B=読み込んだモデル
  const nodes=W=>W.P.filter(p=>['stock','flow','var','conv'].includes(p.kind));const nA=nodes(A),nB=nodes(B);const mB=Object.fromEntries(nB.map(p=>[p.name,p]));const mA=Object.fromEntries(nA.map(p=>[p.name,p]));
  const miss=nA.filter(p=>!mB[p.name]),extra=nB.filter(p=>!mA[p.name]);const kind=nA.filter(p=>mB[p.name]&&mB[p.name].kind!==p.kind);
  const eq=nA.filter(p=>mB[p.name]&&mB[p.name].kind===p.kind&&p.kind!=='conv'&&normEq(p.eq)!==normEq(mB[p.name].eq));
  const fl=nA.filter(p=>p.kind==='flow'&&mB[p.name]&&mB[p.name].kind==='flow'&&((p.src||null)!==(mB[p.name].src||null)||(p.tgt||null)!==(mB[p.name].tgt||null)));
  const lk=W=>new Set(W.P.filter(p=>p.kind==='link').map(p=>p.a+'→'+p.b));const lA=lk(A),lB=lk(B);const lmiss=[...lA].filter(x=>!lB.has(x)),lextra=[...lB].filter(x=>!lA.has(x));
  // 式に出てくる名前にリンクがあるか（InsightMaker の「could not be found」の原因）
  const need=[];nB.forEach(p=>{if(p.kind==='conv')return;const refs=[...String(p.eq||'').matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);refs.forEach(r=>{if(r===p.name)return;const isFlowEnd=p.kind==='flow'&&(p.src===r||p.tgt===r);if(!isFlowEnd&&!lB.has(r+'→'+p.name))need.push(`${r} → ${p.name}`);});});
  return{nA:nA.length,nB:nB.length,miss,extra,kind,eq,fl,lmiss,lextra,need:[...new Set(need)],ok:!miss.length&&!kind.length&&!eq.length&&!fl.length&&!lmiss.length};}
function compareHtml(A,B,mB){const r=compareIM(A,B);const L=(t,a,f)=>a.length?`<h4>${t}（${a.length}）</h4><div class="cmpl">${a.map(f).join('')}</div>`:'';const nm=p=>`<span class="kd k-${p.kind}">${KIND[p.kind]}</span> ${esc(p.name)}`;
  return `<div class="bigmsg">${r.ok?'<b>答えと同じ構造</b>：部品・フローのつながり・式・リンクがすべて一致した。':`答えの部品 ${r.nA}個・読み込んだモデルの部品 ${r.nB}個。下の違いを直す。`}</div>
   ${L('式に出てくるのにリンクがない（InsightMakerで「could not be found」になる）',r.need,x=>`<div class="bad">${esc(x)}</div>`)}
   ${L('足りない部品',r.miss,p=>`<div>${nm(p)} <code>${esc(p.eq)}</code></div>`)}
   ${L('種類が違う部品',r.kind,p=>`<div>${nm(p)}：読み込んだモデルでは ${KIND[mB[p.name].kind]}</div>`)}
   ${L('フローのつながりが違う',r.fl,p=>`<div>${nm(p)}：答え ${esc(p.src||'外')} → ${esc(p.tgt||'外')}／読み込んだ ${esc(mB[p.name].src||'外')} → ${esc(mB[p.name].tgt||'外')}</div>`)}
   ${L('式が違う',r.eq,p=>`<div>${nm(p)}<br><small>答え</small> <code>${esc(p.eq)}</code><br><small>読み込んだ</small> <code>${esc(mB[p.name].eq)}</code></div>`)}
   ${L('足りないリンク',r.lmiss,x=>`<span class="chipx">${esc(x)}</span>`)}
   ${L('答えにない部品（名前の違いの可能性）',r.extra,p=>`<div>${nm(p)}</div>`)}
   ${L('答えにないリンク',r.lextra,x=>`<span class="chipx">${esc(x)}</span>`)}
   <p class="hint">名前は完全に同じ文字で比べる（全角・半角，括弧の違いに注意）。式は空白を除いて比べる。数の書き方（0.3 と .3 など）の違いも「式が違う」と出るので，意味が同じなら気にしなくてよい。</p>`;}

function imToDrawio(W,title){const q=s=>esc(s).replace(/\n/g,'&#xa;');const cells=[];const id={};let n=2;const nid=()=>'c'+(n++);

    cells.push(`<mxCell id="${i}" value="${q(p.name)}" style="${st}" vertex="1" parent="1"><mxGeometry x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" as="geometry"/></mxCell>`);});

    if(!s)s=cloud(p.pt||[0,0]);if(!t)t=cloud(p.pt||[0,0]);id[p.name]=i;cells.push(`<UserObject label="${q(p.name)}" tooltip="${q('流量：'+p.eq)}" id="${i}"><mxCell style="shape=flexArrow;endArrow=classic;html=1;fillColor=#E6F2F3;strokeColor=#2F5466;width=6;endSize=6;fontStyle=1;" edge="1" parent="1" source="${s}" target="${t}"><mxGeometry relative="1" as="geometry"/></mxCell></UserObject>`);});

function cldToDrawio(){const q=s=>esc(s);const cells=[];const id={};C.V.forEach((v,i)=>{id[v]='v'+i;const p=G.pos[v]||[100,100];cells.push(`<mxCell id="${id[v]}" value="${q(v)}" style="rounded=1;arcSize=50;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#5F6E76;fontSize=13;" vertex="1" parent="1"><mxGeometry x="${Math.round(p[0]*1.4-60)}" y="${Math.round(p[1]*1.4-18)}" width="${Math.max(110,tw(v)+24)}" height="36" as="geometry"/></mxCell>`);});

 dice:()=>`<div class="row"><div class="col"><h2>A マッチ棒ゲーム：5人が順に，サイコロの目の数だけマッチ棒を次へ渡す</h2><div id="diceCharts"></div></div>

 five:()=>{const L=loads2025();return `<div class="row"><div class="col"><h2>B 5つの集中ステップを，ブルーマウンテン社のSDモデルで順に試す</h2>
   <div class="fsteps">${[['1','制約を見つける','2025年の負荷率が最も高いラインはどれか'],['2','制約を徹底活用する','段取りと停止を減らし，LINE-3の時間を生産に使う'],['3','他を制約に従属させる','ロープで投入を絞り，安全在庫の引き上げをやめる（DBR）'],['4','制約を高める','品目を他のラインへ移す'],['5','繰り返す','新しい制約はどこか']].map(([n,h,d],i)=>`<div class="fs${i+1<=FS?' on':''}" data-fs="${i+1}"><b>${n}</b><div><strong>${h}</strong><br><small>${d}</small></div></div>`).join('')}</div>

 help:()=>`<div class="helpbox"><h2>使い方</h2><p><b>SDが初めてなら</b>：①の例題リストの「練習（SD入門：ストックとフロー）」1〜5 を順に。各題で ① CLDを読む → ② 1手ずつSDにする（ストック → フロー → 流れを決めるもの → 式と単位）→ ③ 予想してから動かす（Excelと同じ計算表・InsightMakerのファイル付き）。5題のあと④へ進む。</p><p><b>タブは2つのまとまり</b>：①〜③「CLDからSDへ」はどの例題・自分のCLDでも動く。④⑤「ブルーマウンテン社で確かめる」は演習の実データで作ったLINE-3のモデルで，①の例題とは連動しない。演習のCLD（簡略版・詳細版）を選んでいると，③の下と④⑤の上に「CLDの変数・ループ → 演習モデルの部品」の対応が出る。練習4は④へ，練習5は⑤へ続く。ほかのCLDでは，④⑤の上に「遅れ・能力の上限があるか」の案内が出る。</p><ol><li><b>① CLDを選ぶ</b>：例題を選ぶか，「ファイルを開く」で draw.io で描いたCLD（.drawio／.drawio.svg），ワークベンチの保存ファイル，旧CLDアナライザの作業ファイル（段階1・2など），このラボで保存したJSONを読み込む（ドラッグ＆ドロップも可）。draw.io では，変数を図形に，矢印の両端を図形にくっつけ，ラベルに＋か−（遅れは‖）を書く。</li><li><b>② SDに変換</b>：3つのルールで，変数をストック・補助変数・定数に分ける過程を1手ずつ見る。自動の判定は表で変えられる。「✎ 自分で分類する（練習）」では，変数を1つずつ自分で分類してから答え合わせできる（解答例の入った作業ファイルなら解答例と比べる）。</li><li><b>③ 動かす</b>：10日目に定数を1つ変え，ループがどう効くかを見る。InsightMakerのファイルにして，InsightMakerでも動かせる。</li><li><b>④ ブルウィップ効果</b>：顧客 → DC → LINE-3 → 部品サプライヤのモデル。発注残の考慮度・予測期間・情報共有で，上流ほど発注が膨らむ様子と，実績（月別）との比較を見る。</li><li><b>⑤ 制約理論</b>：ザ・ゴールのマッチ棒ゲームと，ブルーマウンテン社での5つの集中ステップ（DBR）。</li></ol>
  <p>③のモデルは，すべての変数の基準値を1にそろえた「感度モデル」：補助変数＝1＋（強さ×効き方×（原因−1））の合計（−の矢印は引く），ストックは目標に「時間」をかけて近づく。形（増えるか減るか，振動するか）を見るためのもので，量は④のように実際の単位と式で作る。</p>
  <p>InsightMaker：insightmaker.com で新しいモデルを作り，「Import」からこのツールが作ったファイルを読み込む。</p></div>`};

    return{id:uo?uo.getAttribute('id'):c.getAttribute('id'),par:c.getAttribute('parent'),v:uo?(uo.getAttribute('label')??uo.getAttribute('value')):c.getAttribute('value'),style:c.getAttribute('style')||'',vx:c.getAttribute('vertex')==='1',ed:c.getAttribute('edge')==='1',
      s:c.getAttribute('source'),t:c.getAttribute('target'),g:g?{x:+g.getAttribute('x')||0,y:+g.getAttribute('y')||0,w:+g.getAttribute('width')||0,h:+g.getAttribute('height')||0,rel:g.getAttribute('relative')==='1'}:null,sp:pt('sourcePoint'),tp:pt('targetPoint')};});
  const by={};raw.forEach(c=>by[c.id]=c);const isEdge=id=>by[id]&&by[id].ed;

  const nodes=raw.filter(c=>c.vx&&c.g&&!(c.par&&isEdge(c.par))&&!/edgeLabel/.test(c.style)&&dxPlain(c.v)).map(c=>{const [x,y]=abs(c);return{id:c.id,name:dxPlain(c.v),x,y,w:c.g.w,h:c.g.h,cx:x+c.g.w/2,cy:y+c.g.h/2};});

  const near=p=>{if(!p)return null;let best=null,bd=1e9;nodes.forEach(n=>{const dx=Math.max(n.x-p[0],0,p[0]-(n.x+n.w)),dy=Math.max(n.y-p[1],0,p[1]-(n.y+n.h));const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=n;}});return bd<=40?best:null;};

function myDocs(V,E,title){const iso=V.filter(v=>!E.some(e=>e.c===v||e.e===v));return `## ${title||'自分のCLD'} @自分\n`+E.map(e=>`${e.c} → ${e.e} ${e.p==='-'?'-':'+'}${e.d?' ‖':''}`).join('\n')+(iso.length?'\n'+iso.map(v=>'# 変数：'+v).join('\n'):'');}

function upsertEx(src){const i=EXAMPLES.findIndex(e=>e.id===src.id);if(i>=0)EXAMPLES[i]=src;else EXAMPLES.push(src);}
(function(){const o=lsGet();Object.values(o).sort((a,b)=>(a.updated||'')<(b.updated||'')?-1:1).forEach(s=>upsertEx(Object.assign(s,{grp:MYGRP,mine:1})));})();

function edPush(){ED.hist.push(snap());if(ED.hist.length>80)ED.hist.shift();ED.fut=[];}

function edAddVar(name,x,y){name=(name||'').trim();if(!name){ED.msg='変数の名前を入れる。';return edRefresh();}if(ED.V.includes(name)){ED.msg=`「${name}」はもうある。`;ED.sel={t:'v',v:name};return edRefresh();}
