<script>
/* SCMIO — SCMリカレント教育ツール共通の入出力モジュール
 * ・Excel（.xlsx）の読み込み・書き出し（外部ライブラリなし。ブラウザ標準の DecompressionStream を使う）
 * ・CSV の読み込み（UTF-8／Shift_JIS 自動判定）・書き出し
 * ・ツール間の受け渡し（同じブラウザ内：localStorage／開いたウィンドウ：postMessage）
 * データは端末の外へ一切送らない。
 * このファイルは src/scm-io.js が原本。build.py が各ツールの <!-- SCMIO:BEGIN --> 〜 <!-- SCMIO:END --> に埋め込む。
 */
(function (root) {

 help:`&lt;h2&gt;① SVN の使い方&lt;/h2&gt;
&lt;p&gt;SVN（Stakeholder Value Network）は，利害関係者を四角，価値（製品・情報・お金・方針）の流れを矢印で描いた図です。この教材では&lt;b&gt;SVNを一度で完成させず&lt;/b&gt;，粗いSVN（SVN-0）に資料を重ね（SVN-1），認知マップの統合で欠けている流れを描き足します（SVN-2）。&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;b&gt;段階&lt;/b&gt;：上のボタンでSVN-0〜2を切り替えます。配置は同じなので，何が描き足されたかを見比べられます。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;立場の視点&lt;/b&gt;：立場を選ぶと，入る流れ・出る流れ，届いている情報が一覧になります。「判断と必要な情報」で，判断に必要な情報が届いているかを考えます（SVN-2の赤の破線を見つける練習）。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;資料を重ねる&lt;/b&gt;：資料ごとに，語っている流れだけが光ります。書き手に「見えている範囲」です。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;上流へたどる&lt;/b&gt;：顧客から流れを上流へたどり，流れごとに3つの問いで仮説を書きます。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;要求と背反&lt;/b&gt;：立場ごとの要求と，ぶつかる要求の組を書きます。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;流れとデータ&lt;/b&gt;：流れごとに記録している表と，通る仮説を見ます。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;描く・直す&lt;/b&gt;：立場と流れの追加・修正，生成AIの下書きの取り込み，例題との比較，Mermaid・draw.io・SVG・CLDアナライザ用の書き出し。&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;作業はブラウザに自動保存されます（同じブラウザで開き直すと続きから）。ファイルにするときは上の「保存」（SVN・認知マップ・CLDをまとめて保存）を使います。ここで描いたSVNの流れは，②認知マップの「補う矢印」の「乗っているSVNの流れ」の一覧に自動で入ります。&lt;/p&gt;`},

 newQ:&#x27;Clear the current diagram and start blank?&#x27;,exQ:&#x27;Clear the current diagram and load the example?&#x27;,
 aiPrompt:&#x27;For a parts maker for industrial machinery (2 plants, 5 production lines, 3 distribution centers, 220 customers, 24 suppliers), list the stakeholders involved from procuring parts and producing them to delivering to customers, including internal departments (sales, production control, SCM, etc.).\nOutput the value flows as CSV without header:\nfrom, to, type (product / information / money / policy), content\nOne flow per line, one kind of value per flow. Prefer the skeleton over details.&#x27;,
 help:`&lt;h2&gt;How to use ① SVN&lt;/h2&gt;
&lt;p&gt;An SVN (Stakeholder Value Network) shows stakeholders as boxes and flows of value (product, information, money, policy) as arrows. In this course the SVN is &lt;b&gt;not completed at once&lt;/b&gt;: start with a coarse SVN (SVN-0), overlay the documents (SVN-1), and add the flows found missing while merging cognitive maps (SVN-2).&lt;/p&gt;
&lt;ol&gt;&lt;li&gt;&lt;b&gt;Stage&lt;/b&gt;: switch SVN-0 to 2 with the buttons; the layout stays the same.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Stakeholder view&lt;/b&gt;: incoming and outgoing flows, and whether the information needed for each decision reaches it.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Overlay documents&lt;/b&gt;: highlight the flows each document talks about.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Trace upstream&lt;/b&gt;: from the customer, ask three questions for each flow and write hypotheses.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Needs &amp; tensions&lt;/b&gt;, &lt;b&gt;Flows &amp; data&lt;/b&gt;, &lt;b&gt;Draw / edit&lt;/b&gt; (AI draft, comparison, export to Mermaid, draw.io and SVG).&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;Work is autosaved in the browser. The example content is in Japanese.&lt;/p&gt;`}};
const T=k=&gt;I[LANG][k];
const TYPES=[&#x27;製品&#x27;,&#x27;情報&#x27;,&#x27;お金&#x27;,&#x27;方針&#x27;,&#x27;欠落&#x27;];
const TCOL={&#x27;製品&#x27;:&#x27;#1F6FB2&#x27;,&#x27;情報&#x27;:&#x27;#55656F&#x27;,&#x27;お金&#x27;:&#x27;#2E8B57&#x27;,&#x27;方針&#x27;:&#x27;#7B3FA0&#x27;,&#x27;欠落&#x27;:&#x27;#C8553D&#x27;};
const GCOL={ext:[&#x27;#FFF4E0&#x27;,&#x27;#E8A33D&#x27;],dep:[&#x27;#E6F2F3&#x27;,&#x27;#0F7C8C&#x27;],fac:[&#x27;#EEF3F5&#x27;,&#x27;#17384A&#x27;],top:[&#x27;#FCE9E5&#x27;,&#x27;#C8553D&#x27;]};
const TYEN={product:&#x27;製品&#x27;,information:&#x27;情報&#x27;,info:&#x27;情報&#x27;,money:&#x27;お金&#x27;,policy:&#x27;方針&#x27;,missing:&#x27;欠落&#x27;};
// ---- 状態
let S=null;
const blank=()=&gt;({title:&#x27;&#x27;,bb:[1200,800],nodes:[],edges:[],docs:{},dec:[],hyp:{},stages:null,stage:0,
  req:{},trd:[],trace:{cur:null,path:[],notes:{}},decAns:{},view:null,sel:null,docSel:null,typeOff:{},tbSel:&#x27;&#x27;});
function loadEx(){const d=JSON.parse(JSON.stringify(SVN_EX));S=Object.assign(blank(),d);S.stage=2;S.trace.cur=&#x27;cust&#x27;;S.isEx=true;fit();render();}
const K=()=&gt;S.stages?S.stage:0;
const nm=(n,k=K())=&gt;S.stages?(n.nm[k]||null):n.nm[0];
const sub=(n,k=K())=&gt;S.stages?(n.sub[k]||&#x27;&#x27;):(n.sub[0]||&#x27;&#x27;);
const lb=(e,k=K())=&gt;S.stages?e.lb[k]:e.lb[0];
const node=id=&gt;S.nodes.find(n=&gt;n.id===id);
const visN=()=&gt;S.nodes.filter(n=&gt;nm(n));
const visE=()=&gt;S.edges.filter(e=&gt;lb(e)&amp;&amp;node(e.f)&amp;&amp;node(e.t)&amp;&amp;nm(node(e.f))&amp;&amp;nm(node(e.t)));
function eStat(e,k=K()){if(!S.stages||k===0)return&#x27;&#x27;;const a=e.lb[k],b=e.lb[k-1];if(!a)return&#x27;&#x27;;if(!b)return&#x27;new&#x27;;return a!==b?&#x27;chg&#x27;:&#x27;&#x27;;}
function nStat(n,k=K()){if(!S.stages||k===0)return&#x27;&#x27;;const a=n.nm[k],b=n.nm[k-1];if(!a)return&#x27;&#x27;;if(!b)return&#x27;new&#x27;;return a!==b||n.sub[k]!==n.sub[k-1]?&#x27;chg&#x27;:&#x27;&#x27;;}
const flowTxt=e=&gt;`${nm(node(e.f))} → ${nm(node(e.t))}：${lb(e)}`;
const flowRaw=e=&gt;`${nm(node(e.f))} → ${nm(node(e.t))}：${(lb(e)||&#x27;&#x27;).replace(/［資料\d］/g,&#x27;&#x27;).replace(/^✕ /,&#x27;&#x27;)}`;
// ---- 保存
function autosave(){try{localStorage.setItem(&#x27;svna&#x27;,JSON.stringify(S));}catch(e){}}
function restore(){try{const s=localStorage.getItem(&#x27;svna&#x27;);if(s){S=Object.assign(blank(),JSON.parse(s));return true;}}catch(e){}return false;}
// ---- 図の描画
let VB=[0,0,1200,800];
function fit(){const ns=visN().length?visN():S.nodes;if(!ns.length){VB=[0,0,1200,800];return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ns.forEach(n=&gt;{x0=Math.min(x0,n.x-n.w/2);x1=Math.max(x1,n.x+n.w/2);y0=Math.min(y0,n.y-n.h/2);y1=Math.max(y1,n.y+n.h/2);});
  S.edges.forEach(e=&gt;{if(e.lp&amp;&amp;!e.free){x0=Math.min(x0,e.lp[0]-80);x1=Math.max(x1,e.lp[0]+80);y0=Math.min(y0,e.lp[1]-20);y1=Math.max(y1,e.lp[1]+20);}});
  VB=[x0-40,y0-40,x1-x0+80,y1-y0+80];}
function boxPt(n,tx,ty){const dx=tx-n.x,dy=ty-n.y;if(!dx&amp;&amp;!dy)return[n.x,n.y];const sx=(n.w/2)/Math.abs(dx||1e-9),sy=(n.h/2)/Math.abs(dy||1e-9),s=Math.min(sx,sy);return[n.x+dx*s,n.y+dy*s];}
function curve(e,par){const a=node(e.f),b=node(e.t);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;let nx=-(b.y-a.y),ny=b.x-a.x;const L=Math.hypot(nx,ny)||1;nx/=L;ny/=L;
  const off=par*38;const cx=mx+nx*off,cy=my+ny*off;const p0=boxPt(a,cx,cy),p1=boxPt(b,cx,cy);
  return{d:`M${p0[0]},${p0[1]} Q${cx},${cy} ${p1[0]},${p1[1]}`,lp:[(p0[0]+2*cx+p1[0])/4,(p0[1]+2*cy+p1[1])/4]};}
function hiSet(){const H={e:null,n:null};
  if(S.docSel){H.e=new Set(visE().filter(e=&gt;(e.docs||[]).includes(+S.docSel)).map(e=&gt;e.id));}
  else if(S.tbSel){H.e=new Set(visE().filter(e=&gt;(e.tb||[]).includes(S.tbSel)).map(e=&gt;e.id));}
  else if(S.sel&amp;&amp;S.sel.n){H.e=new Set(visE().filter(e=&gt;e.f===S.sel.n||e.t===S.sel.n).map(e=&gt;e.id));H.n=new Set([S.sel.n]);}
  else if(S.sel&amp;&amp;S.sel.e){H.e=new Set([S.sel.e]);}
  if(H.e&amp;&amp;!H.n){H.n=new Set();visE().forEach(e=&gt;{if(H.e.has(e.id)){H.n.add(e.f);H.n.add(e.t);}});}
  else if(H.e&amp;&amp;H.n){visE().forEach(e=&gt;{if(H.e.has(e.id)){H.n.add(e.f);H.n.add(e.t);}});}
  return H;}
function render(){renderBars();renderSvg();renderPane();autosave();}
function renderSvg(){
  const sv=$(&#x27;cv&#x27;);const H=hiSet();
  let h=`&lt;defs&gt;${TYPES.map(t=&gt;`&lt;marker id=&quot;m${TYPES.indexOf(t)}&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;8&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot; markerUnits=&quot;userSpaceOnUse&quot;&gt;&lt;path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;${TCOL[t]}&quot;/&gt;&lt;/marker&gt;`).join(&#x27;&#x27;)}&lt;/defs&gt;`;
  const es=visE().filter(e=&gt;!S.typeOff[e.ty]);const pc={};
  es.forEach(e=&gt;{const k=[e.f,e.t].sort().join(&#x27;|&#x27;);pc[k]=(pc[k]||[]);pc[k].push(e);});
  es.forEach(e=&gt;{const k=[e.f,e.t].sort().join(&#x27;|&#x27;),grp=pc[k],i=grp.indexOf(e);let par=(i-(grp.length-1)/2);if(e.f&gt;e.t)par=-par;
    let d,lp;const a=node(e.f),b=node(e.t);
    if(e.d&amp;&amp;!e.free&amp;&amp;!a.moved&amp;&amp;!b.moved){d=e.d+(e.end?` L${e.end[0]},${e.end[1]}`:&#x27;&#x27;);lp=e.lp;}else{const c=curve(e,grp.length&gt;1?par:0.25);d=c.d;lp=c.lp;}
    const st=eStat(e),dim=H.e&amp;&amp;!H.e.has(e.id),sel=S.sel&amp;&amp;S.sel.e===e.id;
    const w=(e.ty===&#x27;製品&#x27;?2.4:e.ty===&#x27;欠落&#x27;?2.4:1.7)*(st?1.6:1)*(sel?1.6:1);
    h+=`&lt;g class=&quot;ed&quot; data-e=&quot;${e.id}&quot; opacity=&quot;${dim?0.12:1}&quot; style=&quot;cursor:pointer&quot;&gt;&lt;path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;transparent&quot; stroke-width=&quot;12&quot;/&gt;&lt;path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${TCOL[e.ty]}&quot; stroke-width=&quot;${w}&quot;${e.ty===&#x27;欠落&#x27;?&#x27; stroke-dasharray=&quot;7 4&quot;&#x27;:&#x27;&#x27;} marker-end=&quot;url(#m${TYPES.indexOf(e.ty)})&quot;/&gt;`+

cmHeader:n=&gt;`# 認知マップを統合したCLD（${n}）`,
langName:&#x27;English&#x27;,
help:`&lt;div class=&quot;help&quot;&gt;
&lt;h2&gt;クイックスタート&lt;/h2&gt;
&lt;ol&gt;
&lt;li&gt;&lt;b&gt;描く&lt;/b&gt;：「③因果ループ」の左のマトリクスで「＋因子」を押して因子を加え，セル（行＝原因，列＝結果）をクリックして＋／−を入れます。右の図でも「＋変数」「＋矢印」で描けます。どちらで直しても，もう一方がすぐに変わります。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;分析する&lt;/b&gt;：入れるたびにループを見つけて R（自己強化型）と B（バランス型）を判定し，右のループ一覧に出します。マトリクスの「表示」で直接／間接，「段数」で何段先まで見るかを選べます。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;読む&lt;/b&gt;：右のループ一覧で行をクリックすると，図とマトリクスでそのループが強調されます。複数のループを選ぶと色分けされます。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;点検する&lt;/b&gt;：「作図チェック」で，変数名・極性・遅れなどの気になる点を確かめます。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;保存・共有する&lt;/b&gt;：上の「保存」で作業全体をJSONに保存します。図はSVG・PNG，データはCSV，InsightMakerやGraphvizにも書き出せます。&lt;/li&gt;
&lt;/ol&gt;
&lt;h2&gt;練習モード（作業ファイルを開いたとき）&lt;/h2&gt;
&lt;p&gt;解答例の入った作業ファイルを開くと（例題の一覧の「作業ファイル 段階A〜D」は社内資料1〜4の順に描き足す教材。段階1・2のファイルはSDへの変換で使う），課題の欄に「▶ 練習モード（1本ずつ）」が出ます。押すと，解答例の矢印を1本ずつ描く順に案内します。原因の変数が緑の枠で点滅し，「ヒント」で結果の変数（橙の枠）と極性の問い，さらに答えと理由が出ます。描いた矢印は自動で判定され（正解・極性の違い・遅れの付け忘れ・向きの逆・解答例にない矢印），ループが閉じるたびに R か B かを問います。前の段階の矢印を消すステップは赤い点線で示します。&lt;/p&gt;
&lt;h2&gt;因果ループ図（CLD）の基本&lt;/h2&gt;
&lt;dl&gt;
&lt;dt&gt;変数&lt;/dt&gt;&lt;dd&gt;増えたり減ったりする「量」や「程度」。名前は中立な名詞にします（○「在庫」，×「在庫の減少」）。&lt;/dd&gt;
&lt;dt&gt;矢印と極性&lt;/dt&gt;&lt;dd&gt;原因が増えたとき結果も増える（減れば減る）なら &lt;b class=&quot;P&quot;&gt;＋&lt;/b&gt;，原因が増えたとき結果が減るなら &lt;b class=&quot;N&quot;&gt;−&lt;/b&gt;。「他の条件は同じなら」と考えて一本ずつ判定します。&lt;/dd&gt;
&lt;dt&gt;ループ&lt;/dt&gt;&lt;dd&gt;矢印をたどって元の変数に戻る経路。ループ上の−が偶数なら &lt;b class=&quot;R&quot;&gt;R：自己強化型&lt;/b&gt;（変化を増幅し，成長や悪循環を生む），奇数なら &lt;b class=&quot;B&quot;&gt;B：バランス型&lt;/b&gt;（変化を打ち消し，目標に近づける）。&lt;/dd&gt;
&lt;dt&gt;遅れ（‖）&lt;/dt&gt;&lt;dd&gt;効果が出るまでに時間がかかる矢印。バランス型ループに遅れがあると，行き過ぎや振動が起きます。&lt;/dd&gt;
&lt;/dl&gt;
&lt;h2&gt;入力の形式&lt;/h2&gt;
&lt;pre&gt;原因, 結果, 極性, 遅れ, 立場
需要, 出荷, +
発注残, 入荷, +, 遅れ
在庫, 欠品, -, , 物流部
孤立した変数だけの行&lt;/pre&gt;
&lt;p&gt;区切りはカンマ（, ，）かタブ。遅れの列には「遅れ」または「delay」と書きます。立場（部門など）は「・」か「/」で複数書けます。&lt;code&gt;#&lt;/code&gt; で始まる行はコメントです。この形式のCSVファイルは，上の「開く」で読み込めます（見出し行があっても構いません）。&lt;/p&gt;
&lt;h2&gt;図の操作&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;選択・移動&lt;/b&gt;：変数をドラッグで動かします。変数や矢印をクリックすると，図の上の帯で名前の変更・極性・遅れ・削除ができます。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;＋変数&lt;/b&gt;：空いている所をクリックして変数を追加します。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;＋矢印&lt;/b&gt;：原因→結果の順に変数をクリックすると，指定した極性の矢印を追加します。&lt;/li&gt;
&lt;li&gt;図で編集すると，左のマトリクスも自動で書き換わります（逆も同じ）。配置は作業と一緒に保存されます。「自動配置し直す」で配置をやり直せます。「ループ一覧」の印を外すと図を広く使えます。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;ループ記号&lt;/b&gt;：各ループの中心に R1，B2 などの記号を表示します。&lt;b&gt;ループを色分け&lt;/b&gt;：選んだループを色で見分けます。&lt;/li&gt;
&lt;/ul&gt;
&lt;h2&gt;マトリクスの読み方&lt;/h2&gt;
&lt;p&gt;行が原因，列が結果です。太字の＋／−は直接の矢印，淡い色の小さな記号は他の変数を経由して届く間接の関係（添字は最短の段数）です。±は経路によって効きが逆になることを表します。ループが多いと間接の関係はほとんどが±になります。これは，フィードバックが絡むと「この変数を増やすと結局どうなるか」が直感では決まらないことを示しています。&lt;/p&gt;
&lt;h2&gt;仮説の検証&lt;/h2&gt;
&lt;p&gt;「この仮説が正しければ何が見えるはずか」をCLDで予測し，データや資料で確かめた事実と照合します。仮説ごとに，出発点（例：予測誤差↑）から結果（例：OTIF）までの経路を選ぶと，経路上の各変数の増減が予測になります。照合表で，予測と観測が矛盾しない仮説を探します。&lt;b&gt;予測はデータを見る前に書きます&lt;/b&gt;：先に仮説と経路だけを入力して予測を固定し（観測事実の表は空のままでよい），データを見てから観測事実を入力して照合すると，「仮説を立てて確かめる」手順になります。「影響の予測」では，ある変数を動かしたときの波及を全経路の符号から求めます。経路によって符号が違う場合（±）は，どの経路が強いかをCLDだけでは決められません。データやシミュレーションで確かめます。&lt;/p&gt;
&lt;h2&gt;認知マップ（立場別・資料別）&lt;/h2&gt;
&lt;p&gt;このタブは作業スペースです。「③因果ループ」のマトリクスと図（CLDの本体）には，「統合してCLDを作る」「このマップだけを開く」を押したときだけ書き込まれます。カードが多いときは，上の「カード：」の目次で開くカードを選びます（Shiftキーを押しながらで複数開く）。&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;資料1枚ごと，または立場ごとにカードを作り，文章を書きます。&lt;/li&gt;
&lt;li&gt;文章の語をマウスで選ぶと「因子に／結果に」のボタンが出ます。ルールによる簡易抽出や生成AIも使えます。生成AIは，全カードをまとめて1回で抽出させ，出力をまとめて貼り付けられます（カード名で振り分けます）。&lt;/li&gt;
&lt;li&gt;矢印ごとに＋／−を判定し，根拠（文章のどこから）と発言者を書きます。変数名に方向や動作（「〜の増加」「〜を引き上げる」）が入っていると，カードの下に「変数名の点検」が出ます。&lt;/li&gt;
&lt;li&gt;統合では，同じものに同じ「統一名」を入れます。「似た名前から統一名を提案」は候補を黄色で入れるだけなので，同じ意味かどうかは人が確かめます。&lt;/li&gt;
&lt;li&gt;資料に書かれていない矢印は「補う矢印」のカードに書き，乗っているSVNの流れを書きます。①で描いたSVNの流れは自動で一覧に入ります（旧SVNアナライザのJSONは「SVNを読み込む」で）。乗る流れがSVNになければSVNに描き足し，「SVNに描き足した」に印を付けます。相手の部門を飛ばした近道の矢印は「×外す」にします。&lt;/li&gt;
&lt;li&gt;「段階ごとの統合」で資料を1つずつ加え，新しく閉じたループを読みます。&lt;/li&gt;
&lt;/ol&gt;
&lt;h2&gt;生成AIとの付き合い方&lt;/h2&gt;
&lt;p&gt;生成AIは変数と矢印の下書きを速く作れますが，変数名に増減が入る，イベントを変数にする，極性を間違える，遅れを落とす，といった誤りがよくあります。下書きは「作図チェック」と人の目で点検します。例題「生成AIの下書き例」で練習できます。&lt;/p&gt;
&lt;h2&gt;用語&lt;/h2&gt;
&lt;dl&gt;
&lt;dt&gt;CLD&lt;/dt&gt;&lt;dd&gt;Causal Loop Diagram（因果ループ図）。&lt;/dd&gt;
&lt;dt&gt;関与ループ数&lt;/dt&gt;&lt;dd&gt;その変数を通るループの数。多いほど多くのフィードバックが通る要所。&lt;/dd&gt;
&lt;dt&gt;外生変数&lt;/dt&gt;&lt;dd&gt;入る矢印がなく，外から与えられる変数（政策や環境条件など）。&lt;/dd&gt;
&lt;dt&gt;システム原型&lt;/dt&gt;&lt;dd&gt;多くの分野で繰り返し現れる典型的なループ構造（成長の限界，問題のすり替わり など）。&lt;/dd&gt;
&lt;/dl&gt;
&lt;h2&gt;データの保存&lt;/h2&gt;
&lt;p&gt;作業はこのブラウザに自動保存され，次に開いたときに復元されます。別のPCで続ける・提出する・共有するときは「保存」でJSONファイルにし，「開く」で読み込みます。データが外部に送られることはありません。&lt;/p&gt;
&lt;/div&gt;`

help:`&lt;div class=&quot;help&quot;&gt;
&lt;h2&gt;Quick start&lt;/h2&gt;
&lt;ol&gt;
&lt;li&gt;&lt;b&gt;Draw&lt;/b&gt;: in &quot;③ Causal loops&quot;, add factors with &quot;+ Factor&quot; in the matrix on the left and click cells (row = cause, column = effect) to enter + or −. You can also draw on the diagram on the right with &quot;+ Variable&quot; and &quot;+ Arrow&quot;. Editing either one updates the other at once.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Analyze&lt;/b&gt;: loops are found and classified as R (reinforcing) or B (balancing) on every edit and listed on the right. In the matrix, &quot;Show&quot; switches direct/indirect and &quot;Steps&quot; sets how far to follow.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Read&lt;/b&gt;: click a loop in the list to highlight it on the diagram and matrix. Select several loops to compare them in colors.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Review&lt;/b&gt;: open &quot;Checks&quot; to see possible problems with names, polarity and delays.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Save and share&lt;/b&gt;: &quot;Save&quot; stores the whole project as JSON. Export the diagram as SVG/PNG, the data as CSV, or for InsightMaker and Graphviz.&lt;/li&gt;
&lt;/ol&gt;
&lt;h2&gt;Practice mode (with an exercise file)&lt;/h2&gt;
&lt;p&gt;When you open an exercise file with a model answer (the built-in &quot;Worksheet stage A–D&quot; add internal memos 1–4 in order; the stage 1–2 files are used for the SD conversion), &quot;▶ Practice mode&quot; appears in the task box. It guides you to draw the model arrows one at a time: the cause variable blinks in green; &quot;Hint&quot; shows the effect (orange) and the polarity question, then the answer and its reason. Each arrow you draw is judged automatically (correct, wrong polarity, missing delay, reversed, not in the answer), and every time a loop closes you are asked whether it is R or B. Arrows to delete from the previous stage are shown as dashed red lines.&lt;/p&gt;
&lt;h2&gt;CLD basics&lt;/h2&gt;
&lt;dl&gt;
&lt;dt&gt;Variable&lt;/dt&gt;&lt;dd&gt;A quantity or level that can go up or down. Use a neutral noun (&quot;Inventory&quot;, not &quot;Decrease in inventory&quot;).&lt;/dd&gt;
&lt;dt&gt;Arrow and polarity&lt;/dt&gt;&lt;dd&gt;&lt;b class=&quot;P&quot;&gt;+&lt;/b&gt; if an increase in the cause increases the effect (and a decrease decreases it); &lt;b class=&quot;N&quot;&gt;−&lt;/b&gt; if an increase in the cause decreases the effect. Judge each arrow with &quot;all else being equal&quot;.&lt;/dd&gt;
&lt;dt&gt;Loop&lt;/dt&gt;&lt;dd&gt;A path of arrows that returns to its start. An even number of &quot;−&quot; makes it &lt;b class=&quot;R&quot;&gt;R: reinforcing&lt;/b&gt; (amplifies change: growth or vicious circles); an odd number makes it &lt;b class=&quot;B&quot;&gt;B: balancing&lt;/b&gt; (counteracts change: goal seeking).&lt;/dd&gt;
&lt;dt&gt;Delay (‖)&lt;/dt&gt;&lt;dd&gt;An arrow whose effect takes time. Delays in balancing loops cause overshoot and oscillation.&lt;/dd&gt;
&lt;/dl&gt;
&lt;h2&gt;Input format&lt;/h2&gt;
&lt;pre&gt;cause, effect, polarity, delay, stakeholder
Demand, Shipments, +
Supply line, Receipts, +, delay
Inventory, Stockouts, -, , Logistics
A variable on its own&lt;/pre&gt;
&lt;p&gt;Separate columns with commas or tabs. Write &quot;delay&quot; in the delay column. List several stakeholders with &quot;/&quot; or &quot;・&quot;. Lines starting with &lt;code&gt;#&lt;/code&gt; are comments. Open a CSV file in this format with &quot;Open&quot; at the top (a header row is fine).&lt;/p&gt;
&lt;h2&gt;Working on the diagram&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Select / move&lt;/b&gt;: drag variables. Click a variable or arrow to rename, change polarity or delay, or delete it in the bar above the diagram.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;+ Variable&lt;/b&gt;: click an empty spot to add a variable.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;+ Arrow&lt;/b&gt;: click the cause and then the effect to add an arrow with the chosen polarity.&lt;/li&gt;
&lt;li&gt;Edits on the diagram update the matrix on the left (and vice versa). Untick &quot;Loop list&quot; for a wider diagram. Positions are saved with the project. &quot;Auto-layout&quot; arranges everything again.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Loop labels&lt;/b&gt; put R1, B2... at the center of each loop. &lt;b&gt;Color loops&lt;/b&gt; shows selected loops in different colors.&lt;/li&gt;
&lt;/ul&gt;
&lt;h2&gt;Reading the matrix&lt;/h2&gt;
&lt;p&gt;Rows are causes, columns are effects. Bold +/− are direct arrows; small pale symbols are indirect relations reached through other variables (subscript = shortest number of steps). ± means the sign depends on the path. With many loops, most indirect relations become ±: with feedback, intuition alone cannot tell what increasing a variable eventually does.&lt;/p&gt;
&lt;h2&gt;Testing hypotheses&lt;/h2&gt;
&lt;p&gt;Predict from the CLD &quot;what we should see if the hypothesis is true&quot;, and compare with facts confirmed by data or documents. For each hypothesis, choose the path from a starting change (e.g. forecast error ↑) to the outcome (e.g. OTIF); the rise or fall of each variable on the path is the prediction. Find the hypothesis whose predictions do not contradict the facts. &quot;Impact prediction&quot; propagates a change through all paths. When paths disagree (±), the CLD alone cannot tell which dominates; check with data or simulation. &lt;b&gt;Write predictions before looking at data&lt;/b&gt;: enter the hypotheses and paths first and lock the predictions (the observation table can stay empty), then enter the observed facts after looking at the data and compare. This turns the tab into a real &quot;hypothesize, then test&quot; procedure.&lt;/p&gt;
&lt;h2&gt;Cognitive maps (by stakeholder / document)&lt;/h2&gt;
&lt;p&gt;This tab is a workspace. The matrix and diagram in &quot;③ Causal loops&quot; (the CLD itself) are written only when you press &quot;Merge into a CLD&quot; or &quot;Open only this map&quot;. With many cards, use the &quot;Cards:&quot; index at the top to choose which card to open (hold Shift to open several).&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;Make a card for each document or stakeholder and write its text.&lt;/li&gt;
&lt;li&gt;Select words in the text to get &quot;Cause / Effect&quot; buttons. Rule-based extraction and generative AI are also available; the AI can extract all cards in one go, and its output can be pasted at once (rows are sorted into cards by card name).&lt;/li&gt;
&lt;li&gt;Judge each link + / − and write the evidence and the speaker. If a variable name contains a direction or action (&quot;increase in&quot;, &quot;raise&quot;), a &quot;name check&quot; appears below the card.&lt;/li&gt;
&lt;li&gt;When merging, give the same &quot;unified name&quot; to the same thing. &quot;Suggest unified names&quot; only fills in candidates in yellow; people check whether they mean the same thing.&lt;/li&gt;
&lt;li&gt;Write links that no document states on a card of &quot;added links&quot;, with the SVN flow they ride on. If the SVN has no such flow, add it to the SVN and tick &quot;Added to SVN&quot;. Mark shortcuts that skip another department &quot;× remove&quot;.&lt;/li&gt;
&lt;li&gt;Use &quot;merging stage by stage&quot; to add one document at a time and read the loops that close.&lt;/li&gt;
&lt;/ol&gt;
&lt;h2&gt;Working with generative AI&lt;/h2&gt;
&lt;p&gt;AI drafts variables and links quickly but often puts directions into names, turns events into variables, gets polarity wrong or omits delays. Review drafts with &quot;Checks&quot; and your own judgment. Practice with the example &quot;AI draft with mistakes&quot;.&lt;/p&gt;
&lt;h2&gt;Glossary&lt;/h2&gt;
&lt;dl&gt;
&lt;dt&gt;CLD&lt;/dt&gt;&lt;dd&gt;Causal loop diagram.&lt;/dd&gt;
&lt;dt&gt;Loop count&lt;/dt&gt;&lt;dd&gt;Number of loops through a variable; high values mark feedback hubs.&lt;/dd&gt;
&lt;dt&gt;Exogenous variable&lt;/dt&gt;&lt;dd&gt;A variable with no incoming arrows, given from outside (policies, environment).&lt;/dd&gt;
&lt;dt&gt;System archetype&lt;/dt&gt;&lt;dd&gt;A loop structure that recurs across fields (limits to growth, shifting the burden, ...).&lt;/dd&gt;
&lt;/dl&gt;
&lt;h2&gt;Saving your work&lt;/h2&gt;
&lt;p&gt;Work is saved automatically in this browser and restored next time. To continue on another computer, submit or share, use &quot;Save&quot; to download a JSON file and &quot;Open&quot; to load it. No data is sent anywhere.&lt;/p&gt;
&lt;/div&gt;`

{id:&#x27;bus&#x27;,name:{ja:&#x27;地域の路線バス（住民・バス会社・自治体）&#x27;,en:&#x27;Local bus service (residents, operator, city)&#x27;},

  {name:&#x27;住民&#x27;,text:&#x27;バスの運行本数が減って不便になったので，最近は車で出かけることが多い。車での外出が増えると道路が混み，バスが時間どおりに来なくなる。時間どおりに来ないバスは不便なので，ますますバスを利用しなくなる。&#x27;,
   rows:[R_(&#x27;運行本数&#x27;,&#x27;バスの便利さ&#x27;,&#x27;+&#x27;,0,&#x27;運行本数が減って不便になった&#x27;),R_(&#x27;バスの便利さ&#x27;,&#x27;車での外出&#x27;,&#x27;-&#x27;,0,&#x27;不便なので車で出かけることが多い&#x27;),R_(&#x27;車での外出&#x27;,&#x27;道路の混雑&#x27;,&#x27;+&#x27;,0,&#x27;車での外出が増えると道路が混む&#x27;),R_(&#x27;道路の混雑&#x27;,&#x27;時間どおりの運行&#x27;,&#x27;-&#x27;,0,&#x27;バスが時間どおりに来なくなる&#x27;),R_(&#x27;時間どおりの運行&#x27;,&#x27;バスの便利さ&#x27;,&#x27;+&#x27;,0,&#x27;時間どおりに来ないバスは不便&#x27;),R_(&#x27;バスの便利さ&#x27;,&#x27;バスの利用&#x27;,&#x27;+&#x27;,0,&#x27;ますますバスを利用しなくなる&#x27;)]},
  {name:&#x27;バス会社&#x27;,text:&#x27;利用者数が減って運賃収入が落ちた。赤字の路線は便数を減らさざるを得ない。運転手も不足しており，運転手不足のため便数を維持できない。&#x27;,
   rows:[R_(&#x27;利用者数&#x27;,&#x27;運賃収入&#x27;,&#x27;+&#x27;,0,&#x27;利用者数が減って運賃収入が落ちた&#x27;),R_(&#x27;運賃収入&#x27;,&#x27;便数&#x27;,&#x27;+&#x27;,1,&#x27;赤字の路線は便数を減らさざるを得ない&#x27;),R_(&#x27;運転手不足&#x27;,&#x27;便数&#x27;,&#x27;-&#x27;,0,&#x27;運転手不足のため便数を維持できない&#x27;)]},
  {name:&#x27;自治体&#x27;,text:&#x27;路線を守るために補助金を出している。補助金を増やせば運行本数は維持できる。しかし乗客数が少ないと補助の効果が見えにくく，議会で予算を確保するのが難しい。&#x27;,
   rows:[R_(&#x27;補助金&#x27;,&#x27;運行本数&#x27;,&#x27;+&#x27;,0,&#x27;補助金を増やせば運行本数は維持できる&#x27;),R_(&#x27;乗客数&#x27;,&#x27;補助の効果の見えやすさ&#x27;,&#x27;+&#x27;,0,&#x27;乗客数が少ないと補助の効果が見えにくい&#x27;),R_(&#x27;補助の効果の見えやすさ&#x27;,&#x27;補助金&#x27;,&#x27;+&#x27;,1,&#x27;予算を確保するのが難しい&#x27;)]}],
  answer:{&#x27;バスの利用&#x27;:&#x27;利用者数&#x27;,&#x27;乗客数&#x27;:&#x27;利用者数&#x27;,&#x27;便数&#x27;:&#x27;運行本数&#x27;}},
 en:{depts:[
  {name:&#x27;Residents&#x27;,text:&#x27;Bus service frequency has been cut, so the bus is less convenient and we drive more often. When more people drive, the roads get congested and buses no longer run on time. A bus that does not come on time is inconvenient, so we use the bus even less.&#x27;,
   rows:[R_(&#x27;Service frequency&#x27;,&#x27;Bus convenience&#x27;,&#x27;+&#x27;,0,&#x27;frequency has been cut, so the bus is less convenient&#x27;),R_(&#x27;Bus convenience&#x27;,&#x27;Car trips&#x27;,&#x27;-&#x27;,0,&#x27;we drive more often&#x27;),R_(&#x27;Car trips&#x27;,&#x27;Road congestion&#x27;,&#x27;+&#x27;,0,&#x27;when more people drive, the roads get congested&#x27;),R_(&#x27;Road congestion&#x27;,&#x27;On-time performance&#x27;,&#x27;-&#x27;,0,&#x27;buses no longer run on time&#x27;),R_(&#x27;On-time performance&#x27;,&#x27;Bus convenience&#x27;,&#x27;+&#x27;,0,&#x27;a bus that does not come on time is inconvenient&#x27;),R_(&#x27;Bus convenience&#x27;,&#x27;Bus use&#x27;,&#x27;+&#x27;,0,&#x27;we use the bus even less&#x27;)]},
  {name:&#x27;Bus operator&#x27;,text:&#x27;Ridership has dropped and fare revenue has fallen. We have no choice but to cut trips on loss-making routes. We are also short of drivers, so we cannot keep the number of trips.&#x27;,
   rows:[R_(&#x27;Ridership&#x27;,&#x27;Fare revenue&#x27;,&#x27;+&#x27;,0,&#x27;ridership has dropped and fare revenue has fallen&#x27;),R_(&#x27;Fare revenue&#x27;,&#x27;Number of trips&#x27;,&#x27;+&#x27;,1,&#x27;cut trips on loss-making routes&#x27;),R_(&#x27;Driver shortage&#x27;,&#x27;Number of trips&#x27;,&#x27;-&#x27;,0,&#x27;short of drivers, so we cannot keep the number of trips&#x27;)]},
  {name:&#x27;City office&#x27;,text:&#x27;We pay a subsidy to keep the routes. More subsidy keeps the service frequency. But when passenger numbers are low, the effect of the subsidy is hard to see, and it is difficult to secure the budget in the council.&#x27;,
   rows:[R_(&#x27;Subsidy&#x27;,&#x27;Service frequency&#x27;,&#x27;+&#x27;,0,&#x27;more subsidy keeps the service frequency&#x27;),R_(&#x27;Passenger numbers&#x27;,&#x27;Visibility of subsidy effect&#x27;,&#x27;+&#x27;,0,&#x27;when passenger numbers are low, the effect is hard to see&#x27;),R_(&#x27;Visibility of subsidy effect&#x27;,&#x27;Subsidy&#x27;,&#x27;+&#x27;,1,&#x27;difficult to secure the budget&#x27;)]}],

{id:&#x27;bm&#x27;,name:{ja:&#x27;部品メーカーの欠品問題（5部門）&#x27;,en:&#x27;Stockouts at a parts maker (5 departments)&#x27;},
 ja:{depts:[
  {name:&#x27;SCM部&#x27;,text:&#x27;欠品が増えたため，主力品の安全在庫を平均需要の18日分から24日分に引き上げた。安全在庫の設定を上げた分は，補充指示として生産に出している。在庫が増えれば欠品は減るはずだと考えている。&#x27;,
   rows:[R_(&#x27;欠品&#x27;,&#x27;安全在庫の設定&#x27;,&#x27;+&#x27;,1,&#x27;欠品が増えたため安全在庫を引き上げた&#x27;),R_(&#x27;安全在庫の設定&#x27;,&#x27;補充指示&#x27;,&#x27;+&#x27;,0,&#x27;設定を上げた分は補充指示として生産に出している&#x27;),R_(&#x27;安全在庫の設定&#x27;,&#x27;在庫&#x27;,&#x27;+&#x27;,1,&#x27;安全在庫を上げれば在庫が増える（SCM部の想定）&#x27;),R_(&#x27;在庫&#x27;,&#x27;欠品&#x27;,&#x27;-&#x27;,0,&#x27;在庫が増えれば欠品は減るはず&#x27;)]},
  {name:&#x27;営業部&#x27;,text:&#x27;品切れが起きると顧客に迷惑をかけるので，販売計画には余裕を上乗せして出さざるを得ない。それなのに生産が計画どおりに作ってくれず，生産の遅れで品切れが起きる。品切れが続くと，顧客から注文を取り消されることもある。&#x27;,
   rows:[R_(&#x27;品切れ&#x27;,&#x27;販売計画&#x27;,&#x27;+&#x27;,0,&#x27;品切れが起きるので販売計画に余裕を上乗せする&#x27;),R_(&#x27;生産の遅れ&#x27;,&#x27;品切れ&#x27;,&#x27;+&#x27;,0,&#x27;生産の遅れで品切れが起きる&#x27;),R_(&#x27;品切れ&#x27;,&#x27;注文の取消&#x27;,&#x27;+&#x27;,1,&#x27;品切れが続くと注文を取り消される&#x27;)]},
  {name:&#x27;生産管理課&#x27;,text:&#x27;営業の販売計画は過大なので，そのまま作ると在庫が余る。そのため販売計画を割り引いて生産計画を立てている。補充指示が増えると生産待ちが増え，補充指示から出荷可能までの補充リードタイムが1週間程度から2週間以上に延びた。段取り替えに月50時間以上を取られ，生産能力が足りない。段取り中は稼働率に数えないので，段取りが増えると稼働率は下がって見える。&#x27;,
   rows:[R_(&#x27;販売計画&#x27;,&#x27;生産計画&#x27;,&#x27;+&#x27;,0,&#x27;販売計画をもとに生産計画を立てる&#x27;),R_(&#x27;販売計画&#x27;,&#x27;計画の割引&#x27;,&#x27;+&#x27;,0,&#x27;販売計画が過大なので割り引く&#x27;),R_(&#x27;計画の割引&#x27;,&#x27;生産計画&#x27;,&#x27;-&#x27;,0,&#x27;割り引いて生産計画を立てる&#x27;),R_(&#x27;在庫量&#x27;,&#x27;計画の割引&#x27;,&#x27;+&#x27;,0,&#x27;そのまま作ると在庫が余るので割り引く&#x27;),R_(&#x27;生産計画&#x27;,&#x27;在庫量&#x27;,&#x27;+&#x27;,1,&#x27;作れば在庫が増える&#x27;),R_(&#x27;補充指示&#x27;,&#x27;生産待ち&#x27;,&#x27;+&#x27;,0,&#x27;補充指示が増えると生産待ちが増える&#x27;),R_(&#x27;生産待ち&#x27;,&#x27;補充リードタイム&#x27;,&#x27;+&#x27;,0,&#x27;補充リードタイムが1週間から2週間以上に延びた&#x27;),R_(&#x27;段取り時間&#x27;,&#x27;生産能力&#x27;,&#x27;-&#x27;,0,&#x27;段取り替えに月50時間以上取られる&#x27;),R_(&#x27;生産能力&#x27;,&#x27;生産待ち&#x27;,&#x27;-&#x27;,0,&#x27;能力が足りないので待ちがはけない&#x27;),R_(&#x27;段取り時間&#x27;,&#x27;稼働率&#x27;,&#x27;-&#x27;,0,&#x27;段取り中は稼働率に数えない&#x27;)]},
  {name:&#x27;経営企画部&#x27;,text:&#x27;ラインの稼働率は84%で，まだ余裕がある。生産待ちが多くなればラインは止まらず稼働率は上がる。稼働率が高くなれば設備増設を検討するが，今回は差し戻した。設備を増設すれば生産能力は上がるが，効果が出るまでに時間がかかる。&#x27;,
   rows:[R_(&#x27;生産待ち&#x27;,&#x27;稼働率&#x27;,&#x27;+&#x27;,0,&#x27;生産待ちが多いとラインは止まらない&#x27;),R_(&#x27;稼働率&#x27;,&#x27;設備増設&#x27;,&#x27;+&#x27;,0,&#x27;稼働率が高くなれば設備増設を検討する&#x27;),R_(&#x27;設備増設&#x27;,&#x27;生産能力&#x27;,&#x27;+&#x27;,1,&#x27;増設すれば能力は上がるが時間がかかる&#x27;)]},
  {name:&#x27;物流部&#x27;,text:&#x27;特急便の使用が前年比約30%増えた。単価は通常便の約3倍で，物流費が増えている。使用理由の大半は欠品分の追加出荷で，特急便を使えば顧客への欠品は減らせる。&#x27;,
   rows:[R_(&#x27;欠品&#x27;,&#x27;特急便&#x27;,&#x27;+&#x27;,0,&#x27;使用理由の大半は欠品分の追加出荷&#x27;),R_(&#x27;特急便&#x27;,&#x27;物流費&#x27;,&#x27;+&#x27;,0,&#x27;単価は通常便の約3倍&#x27;),R_(&#x27;特急便&#x27;,&#x27;欠品&#x27;,&#x27;-&#x27;,0,&#x27;特急便を使えば顧客への欠品は減らせる&#x27;)]}],
  answer:{&#x27;品切れ&#x27;:&#x27;欠品&#x27;,&#x27;在庫量&#x27;:&#x27;在庫&#x27;,&#x27;生産の遅れ&#x27;:&#x27;補充リードタイム&#x27;}},
 en:{depts:[
  {name:&#x27;SCM&#x27;,text:&#x27;Because stockouts increased, we raised the safety stock of key items from 18 to 24 days of average demand. The raised safety stock setting is passed to production as replenishment orders. More inventory should mean fewer stockouts.&#x27;,
   rows:[R_(&#x27;Stockouts&#x27;,&#x27;Safety stock setting&#x27;,&#x27;+&#x27;,1,&#x27;because stockouts increased, we raised the safety stock&#x27;),R_(&#x27;Safety stock setting&#x27;,&#x27;Replenishment orders&#x27;,&#x27;+&#x27;,0,&#x27;passed to production as replenishment orders&#x27;),R_(&#x27;Safety stock setting&#x27;,&#x27;Inventory&#x27;,&#x27;+&#x27;,1,&#x27;raising safety stock raises inventory (SCM assumption)&#x27;),R_(&#x27;Inventory&#x27;,&#x27;Stockouts&#x27;,&#x27;-&#x27;,0,&#x27;more inventory should mean fewer stockouts&#x27;)]},
  {name:&#x27;Sales&#x27;,text:&#x27;Out-of-stock situations hurt our customers, so we have to pad the sales plan. Yet production does not build to plan, and production delays cause out-of-stock situations. When they continue, customers cancel orders.&#x27;,

 d3:{name:&#x27;資料3 生産管理課長のメール&#x27;,kind:&#x27;doc&#x27;,text:&#x27;生産管理課長のメール（2025年2月6日）。件名：第3ラインの状況について（再送）。第3ラインは段取り替えに月50時間以上を取られています。補充指示を受けてから出せるまでの日数が，以前は1週間程度だったものが，最近は2週間以上かかることが珍しくありません。設備増設の稟議を上げたいのですが，稼働率が84%であることを理由に「まだ2割近く余裕がある」と差し戻されています。なお他のラインは比較的余裕があり，第4ラインは半分程度の稼働です。&#x27;,

        W(&#x27;補充指示&#x27;,&#x27;出せるまでの日数&#x27;,&#x27;+&#x27;,0,&#x27;補充指示を受けてから出せるまでの日数が，以前は1週間程度だったものが，最近は2週間以上かかることが珍しくありません&#x27;,&#x27;生産管理課&#x27;),
        W(&#x27;稼働率&#x27;,&#x27;設備増設&#x27;,&#x27;+&#x27;,0,&#x27;稼働率が84%であることを理由に「まだ2割近く余裕がある」と差し戻されています&#x27;,&#x27;経営（課長の報告）&#x27;),
        W(&#x27;設備増設&#x27;,&#x27;生産能力&#x27;,&#x27;+&#x27;,1,&#x27;設備増設の稟議を上げたいのですが&#x27;,&#x27;生産管理課&#x27;)]},
 d4:{name:&#x27;資料4 物流部メモ&#x27;,kind:&#x27;doc&#x27;,text:&#x27;物流部メモ（2025年6月11日）。2025年度上期の物流費が予算を超過する見込みです。特急便の使用件数が前年同期比で約30%増加。単価は通常便の約3倍。運送会社より，来期の料金改定（値上げ）の申し入れあり。特急便の使用理由を集計したところ，その大半が「欠品分の追加出荷」でした。物流部の運用改善では対応しきれない水準に達しています。&#x27;,
  rows:[W(&#x27;欠品&#x27;,&#x27;特急便&#x27;,&#x27;+&#x27;,0,&#x27;特急便の使用理由を集計したところ，その大半が「欠品分の追加出荷」でした&#x27;,&#x27;物流部&#x27;),
        W(&#x27;特急便&#x27;,&#x27;物流費&#x27;,&#x27;+&#x27;,0,&#x27;単価は通常便の約3倍&#x27;,&#x27;物流部&#x27;),
        W(&#x27;運賃の値上げ&#x27;,&#x27;物流費&#x27;,&#x27;+&#x27;,1,&#x27;運送会社より，来期の料金改定（値上げ）の申し入れあり&#x27;,&#x27;物流部&#x27;)]},
 bA:{name:&#x27;補A 流れで補う（資料1）&#x27;,kind:&#x27;bridge&#x27;,text:&#x27;資料1には，SCM部の判断（欠品が増えた → 設定を上げる）と期待（設定を上げる → 初回充足率が上がる）しか書かれていない。期待の矢印は，工場と物流センターを飛ばした「近道」。SVNの流れ（顧客 → 営業部：注文，SCM部 → 工場：補充指示，工場 → 物流センター：製品，物流センター → 顧客：出荷，物流センター → SCM部：在庫・欠品）に沿って展開し，近道の矢印は外す。初回充足率は欠品の裏返しなので，欠品で表す。&#x27;,
  rows:[B(&#x27;需要&#x27;,&#x27;補充指示&#x27;,&#x27;+&#x27;,0,&#x27;注文が増えれば補充する量も増える&#x27;,&#x27;顧客 → 営業部：注文／物流センター → SCM部：在庫・欠品&#x27;),
        B(&#x27;需要&#x27;,&#x27;在庫&#x27;,&#x27;-&#x27;,0,&#x27;出荷すると在庫は減る&#x27;,&#x27;物流センター → 顧客：出荷・納品&#x27;),
        B(&#x27;安全在庫の設定&#x27;,&#x27;補充指示&#x27;,&#x27;+&#x27;,0,&#x27;設定を上げた分を補充指示として出す&#x27;,&#x27;SCM部 → 工場：補充指示［資料3］&#x27;),
        B(&#x27;在庫&#x27;,&#x27;補充指示&#x27;,&#x27;-&#x27;,0,&#x27;在庫が多ければ補充は少なくてよい&#x27;,&#x27;物流センター → SCM部：在庫・欠品&#x27;),
        B(&#x27;補充指示&#x27;,&#x27;生産&#x27;,&#x27;+&#x27;,0,&#x27;ここでは工場の中を省略する（段階Cで展開する）&#x27;,&#x27;SCM部 → 工場：補充指示&#x27;),
        B(&#x27;生産&#x27;,&#x27;在庫&#x27;,&#x27;+&#x27;,1,&#x27;作った製品が在庫になるまで時間がかかる&#x27;,&#x27;工場 → 物流センター：製品&#x27;),
        B(&#x27;在庫&#x27;,&#x27;欠品&#x27;,&#x27;-&#x27;,0,&#x27;在庫が多いほど欠品は減る&#x27;,&#x27;（物流センターの中）&#x27;),
        B(&#x27;欠品&#x27;,&#x27;OTIF&#x27;,&#x27;-&#x27;,0,&#x27;欠品があると納期どおりに全量を届けられない&#x27;,&#x27;物流センター → 運送会社 → 顧客：出荷・配送&#x27;),
        B(&#x27;安全在庫の設定&#x27;,&#x27;初回充足率&#x27;,&#x27;x&#x27;,0,&#x27;近道：設定 → 補充指示 → 生産 → 在庫 → 欠品 の経路に置き換えた&#x27;,&#x27;&#x27;),
        B(&#x27;初回充足率&#x27;,&#x27;特急輸送費&#x27;,&#x27;x&#x27;,0,&#x27;近道：欠品 → 特急便 → 物流費（段階Dで描く）に置き換えた&#x27;,&#x27;&#x27;)]},
 bB:{name:&#x27;補B 流れで補う（資料2）&#x27;,kind:&#x27;bridge&#x27;,text:&#x27;資料2の発言は，どれも相手の部門を飛ばした近道になっている。営業部「生産が計画どおりに作らない → 欠品」，生産管理課「過大な販売計画 → 在庫が余る」，SCM部「設定を上げた → 欠品が減るはず」。SVNの流れ（営業部 → 生産管理課：販売計画，生産管理課 → 工場：生産計画，顧客 → 営業部：注文・苦情）に沿って展開し，近道は外す。苦情と取引条件の見直しは，顧客が離れていく「顧客の取消」でまとめる。&#x27;,
  rows:[B(&#x27;販売計画の上乗せ&#x27;,&#x27;生産計画&#x27;,&#x27;+&#x27;,0,&#x27;上乗せした販売計画が生産計画になる（生産管理課「そのとおり作ると」）&#x27;,&#x27;営業部 → 生産管理課：販売計画（余裕を上乗せ）［資料2］&#x27;),
        B(&#x27;生産計画&#x27;,&#x27;補充指示&#x27;,&#x27;+&#x27;,0,&#x27;生産計画が工場への指示になる&#x27;,&#x27;生産管理課 → 工場：生産計画・生産指示&#x27;),
        B(&#x27;顧客の取消&#x27;,&#x27;需要&#x27;,&#x27;-&#x27;,0,&#x27;取り消された注文は需要から抜ける&#x27;,&#x27;顧客 → 営業部：注文・苦情（取引見直し）［資料2］&#x27;),
        B(&#x27;販売計画の上乗せ&#x27;,&#x27;在庫&#x27;,&#x27;x&#x27;,0,&#x27;近道：上乗せ → 生産計画 → 補充指示 → 生産 → 在庫 に置き換えた&#x27;,&#x27;&#x27;),
        B(&#x27;生産&#x27;,&#x27;欠品&#x27;,&#x27;x&#x27;,0,&#x27;近道：生産 → 在庫 → 欠品 に置き換えた&#x27;,&#x27;&#x27;),
        B(&#x27;安全在庫の設定&#x27;,&#x27;欠品&#x27;,&#x27;x&#x27;,0,&#x27;近道：設定 → 補充指示 → 生産 → 在庫 → 欠品 に置き換えた&#x27;,&#x27;&#x27;)]},
 bC:{name:&#x27;補C 流れで補う（資料3）&#x27;,kind:&#x27;bridge&#x27;,text:&#x27;資料3の「補充指示が増えれば出せるまでの日数が延びる」は，工場の中を飛ばした近道。第3ラインの中（仕事量と能力 → 負荷 → 待ち → 補充リードタイム）を展開し，段階A・Bで省略した「補充指示 → 生産」も外す。稼働率84%は段取り時間をどう数えたかで見え方が変わる（見かけの稼働率）。&#x27;,
  rows:[B(&#x27;補充指示&#x27;,&#x27;ライン負荷率&#x27;,&#x27;+&#x27;,0,&#x27;指示が増えると第3ラインの仕事量が増える&#x27;,&#x27;SCM部 → 第3ライン：補充指示［資料3］&#x27;),
        B(&#x27;生産能力&#x27;,&#x27;ライン負荷率&#x27;,&#x27;-&#x27;,0,&#x27;負荷率＝仕事量÷能力&#x27;,&#x27;（第3ラインの中）&#x27;),
        B(&#x27;ライン負荷率&#x27;,&#x27;生産待ち&#x27;,&#x27;+&#x27;,0,&#x27;負荷が高いと待ちが増える。1に近づくと急増する（待ち行列の性質）&#x27;,&#x27;（第3ラインの中）&#x27;),
        B(&#x27;生産待ち&#x27;,&#x27;生産&#x27;,&#x27;+&#x27;,0,&#x27;待っている仕事があれば作る（能力の範囲で）&#x27;,&#x27;（第3ラインの中）&#x27;),
        B(&#x27;生産能力&#x27;,&#x27;生産&#x27;,&#x27;+&#x27;,0,&#x27;能力が生産の上限を決める&#x27;,&#x27;（第3ラインの中）&#x27;),
        B(&#x27;生産待ち&#x27;,&#x27;補充リードタイム&#x27;,&#x27;+&#x27;,0,&#x27;待ちが長いと，補充指示から出せるまでが延びる&#x27;,&#x27;第3ライン → 生産管理課：補充が2週間以上［資料3］&#x27;),
        B(&#x27;補充リードタイム&#x27;,&#x27;欠品&#x27;,&#x27;+&#x27;,0,&#x27;補充が遅れると欠品が増える&#x27;,&#x27;第3ライン → 物流センター：製品&#x27;),
        B(&#x27;ライン負荷率&#x27;,&#x27;稼働率（見かけ）&#x27;,&#x27;+&#x27;,0,&#x27;負荷が高いと稼働率も上がる&#x27;,&#x27;生産管理課 → 経営：設備増設の稟議（稼働率84％）［資料3］&#x27;),
        B(&#x27;段取り時間&#x27;,&#x27;稼働率（見かけ）&#x27;,&#x27;-&#x27;,0,&#x27;段取り中を稼働に数えなければ，稼働率は低く見える（測り方の問題）&#x27;,&#x27;生産管理課 → 経営：設備増設の稟議（稼働率84％）［資料3］&#x27;),
        B(&#x27;補充指示&#x27;,&#x27;生産&#x27;,&#x27;x&#x27;,0,&#x27;段階A・Bで省略した矢印。補充指示 → 負荷 → 待ち → 生産 に置き換えた&#x27;,&#x27;&#x27;),
        B(&#x27;補充指示&#x27;,&#x27;補充リードタイム&#x27;,&#x27;x&#x27;,0,&#x27;近道：補充指示 → 負荷 → 待ち → 補充リードタイム に置き換えた&#x27;,&#x27;&#x27;)]},
 bD:{name:&#x27;補D 流れと仮説で補う（資料4）&#x27;,kind:&#x27;bridge&#x27;,text:&#x27;物流部は特急便が物流費を押し上げることを書いているが，特急便が顧客の欠品を埋めていることは書いていない。また，原先生が挙げた他の仮説（H1 予測誤差，H3 部品の納入遅延，H4 配送日数）の変数を描き足す。ここでは，乗せる流れがSVN-1にないものがある（特急便の出荷指示，部品の発注と入荷，需要予測）。第1部 p.11の業務の流れを見て，SVNに描き足す。&#x27;,
  rows:[B(&#x27;特急便&#x27;,&#x27;欠品&#x27;,&#x27;-&#x27;,0,&#x27;特急便で顧客への欠品を埋める&#x27;,&#x27;物流部 → 物流センター：出荷指示（特急便）&#x27;,1),
        B(&#x27;予測誤差&#x27;,&#x27;欠品&#x27;,&#x27;+&#x27;,0,&#x27;H1：予測が外れると，必要な品目の在庫が足りなくなる&#x27;,&#x27;営業部 → 生産管理課：需要予測・販売計画&#x27;,1),
        B(&#x27;配送日数&#x27;,&#x27;OTIF&#x27;,&#x27;-&#x27;,0,&#x27;H4：配送に時間がかかれば納期に遅れる&#x27;,&#x27;運送会社 → 顧客：配送&#x27;),
        B(&#x27;部品の納入遅延&#x27;,&#x27;部品不足&#x27;,&#x27;+&#x27;,0,&#x27;H3：納入が遅れると部品が足りなくなる&#x27;,&#x27;購買 → サプライヤ：部品の発注／サプライヤ → 購買：納期回答・入荷&#x27;,1),
        B(&#x27;部品不足&#x27;,&#x27;生産&#x27;,&#x27;-&#x27;,0,&#x27;H3：部品が足りないと作れない&#x27;,&#x27;サプライヤ → 工場：部品&#x27;)]}
};
const EN={
 d1:{name:&#x27;Memo 1 SCM proposal&#x27;,kind:&#x27;doc&#x27;,text:&#x27;Proposal (18 March 2024). Subject: raising safety stock for key products. Since late 2023, delivery delays and stockouts have increased, mainly for key products. The safety stock is currently &quot;18 days of average demand&quot; for all SKUs, but classes A and B will be raised to 24 days. Class C stays unchanged for inventory turnover. Start: 1 April 2024. Impact: working capital +240 million yen. Expected effect: the first-fill rate improves by 5 points and express shipping cost falls.&#x27;,
  rows:[W(&#x27;Stockouts&#x27;,&#x27;Safety stock setting&#x27;,&#x27;+&#x27;,1,&#x27;Since late 2023, delivery delays and stockouts have increased, mainly for key products.&#x27;,&#x27;SCM&#x27;),
        W(&#x27;Safety stock setting&#x27;,&#x27;Working capital&#x27;,&#x27;+&#x27;,0,&#x27;Impact: working capital +240 million yen.&#x27;,&#x27;SCM&#x27;),
        W(&#x27;Safety stock setting&#x27;,&#x27;First-fill rate&#x27;,&#x27;+&#x27;,1,&#x27;Expected effect: the first-fill rate improves by 5 points and express shipping cost falls.&#x27;,&#x27;SCM&#x27;),
        W(&#x27;First-fill rate&#x27;,&#x27;Express shipping cost&#x27;,&#x27;-&#x27;,0,&#x27;Expected effect: the first-fill rate improves by 5 points and express shipping cost falls.&#x27;,&#x27;SCM&#x27;)]},
 d2:{name:&#x27;Memo 2 Sales–production meeting&#x27;,kind:&#x27;doc&#x27;,text:&#x27;Sales–production meeting (22 May 2024). Three S-rank customers complained that promised delivery dates are not kept. One of them hinted at revising the trading terms. Sales: &quot;Production does not build to plan.&quot; Production control: &quot;The sales plan is inflated. Building to it leaves excess stock.&quot; Sales: &quot;Stockouts happen, so we have to submit a padded plan.&quot; SCM: &quot;We approved raising safety stock in March. We want to wait for the effect.&quot;&#x27;,
  rows:[W(&#x27;Late deliveries&#x27;,&#x27;Complaints&#x27;,&#x27;+&#x27;,0,&#x27;Three S-rank customers complained that promised delivery dates are not kept.&#x27;,&#x27;Customers (reported by Sales)&#x27;),
        W(&#x27;Complaints&#x27;,&#x27;Revision of trading terms&#x27;,&#x27;+&#x27;,1,&#x27;One of them hinted at revising the trading terms.&#x27;,&#x27;Customers (reported by Sales)&#x27;),
        W(&#x27;Stockouts&#x27;,&#x27;Plan padding&#x27;,&#x27;+&#x27;,0,&#x27;Sales: &quot;Stockouts happen, so we have to submit a padded plan.&quot;&#x27;,&#x27;Sales&#x27;),
        W(&#x27;Production&#x27;,&#x27;Stockouts&#x27;,&#x27;-&#x27;,0,&#x27;Sales: &quot;Production does not build to plan.&quot;&#x27;,&#x27;Sales&#x27;),
        W(&#x27;Plan padding&#x27;,&#x27;Inventory&#x27;,&#x27;+&#x27;,0,&#x27;Production control: &quot;The sales plan is inflated. Building to it leaves excess stock.&quot;&#x27;,&#x27;Production control&#x27;),
        W(&#x27;Safety stock setting&#x27;,&#x27;Stockouts&#x27;,&#x27;-&#x27;,1,&#x27;SCM: &quot;We approved raising safety stock in March. We want to wait for the effect.&quot;&#x27;,&#x27;SCM&#x27;)]},
 d3:{name:&#x27;Memo 3 Production control manager&#x27;,kind:&#x27;doc&#x27;,text:&#x27;Production control manager\&#x27;s e-mail (6 February 2025). Subject: status of Line 3 (resent). Line 3 loses more than 50 hours a month to changeovers. The days from receiving a replenishment order to shipping used to be about one week; now more than two weeks is common. I want to request more equipment, but the request is sent back because utilization is 84%, &quot;still almost 20% room&quot;. Other lines have relatively more room; Line 4 runs at about half.&#x27;,
  rows:[W(&#x27;Changeover time&#x27;,&#x27;Production capacity&#x27;,&#x27;-&#x27;,0,&#x27;Line 3 loses more than 50 hours a month to changeovers.&#x27;,&#x27;Production control&#x27;),
        W(&#x27;Replenishment orders&#x27;,&#x27;Days to ship&#x27;,&#x27;+&#x27;,0,&#x27;The days from receiving a replenishment order to shipping used to be about one week; now more than two weeks is common.&#x27;,&#x27;Production control&#x27;),
        W(&#x27;Utilization&#x27;,&#x27;Equipment investment&#x27;,&#x27;+&#x27;,0,&#x27;the request is sent back because utilization is 84%, &quot;still almost 20% room&quot;&#x27;,&#x27;Management (reported by production control)&#x27;),
        W(&#x27;Equipment investment&#x27;,&#x27;Production capacity&#x27;,&#x27;+&#x27;,1,&#x27;I want to request more equipment&#x27;,&#x27;Production control&#x27;)]},
 d4:{name:&#x27;Memo 4 Logistics&#x27;,kind:&#x27;doc&#x27;,text:&#x27;Logistics memo (11 June 2025). Logistics cost for the first half of FY2025 is expected to exceed the budget. Express shipments rose about 30% year on year. Their unit cost is about three times normal shipping. The carrier has asked for a price increase next year. Most express use turned out to be &quot;extra shipments for stockouts&quot;. This is beyond what operational improvement in logistics can absorb.&#x27;,
  rows:[W(&#x27;Stockouts&#x27;,&#x27;Express shipping&#x27;,&#x27;+&#x27;,0,&#x27;Most express use turned out to be &quot;extra shipments for stockouts&quot;.&#x27;,&#x27;Logistics&#x27;),
        W(&#x27;Express shipping&#x27;,&#x27;Logistics cost&#x27;,&#x27;+&#x27;,0,&#x27;Their unit cost is about three times normal shipping.&#x27;,&#x27;Logistics&#x27;),
        W(&#x27;Carrier price increase&#x27;,&#x27;Logistics cost&#x27;,&#x27;+&#x27;,1,&#x27;The carrier has asked for a price increase next year.&#x27;,&#x27;Logistics&#x27;)]},
 bA:{name:&#x27;Add A: flows (memo 1)&#x27;,kind:&#x27;bridge&#x27;,text:&#x27;Memo 1 only states the SCM decision (stockouts rose → raise the setting) and its expectation (raise the setting → first-fill rate rises). The expectation is a &quot;shortcut&quot; that skips the plant and the distribution center. Expand it along the SVN flows (customer → sales: orders; SCM → plant: replenishment orders; plant → DC: products; DC → customer: shipments; DC → SCM: inventory and stockouts) and remove the shortcut. The first-fill rate is the flip side of stockouts, so use Stockouts.&#x27;,
  rows:[B(&#x27;Demand&#x27;,&#x27;Replenishment orders&#x27;,&#x27;+&#x27;,0,&#x27;More orders mean more to replenish&#x27;,&#x27;customer → sales: orders / DC → SCM: inventory and stockouts&#x27;),
        B(&#x27;Demand&#x27;,&#x27;Inventory&#x27;,&#x27;-&#x27;,0,&#x27;Shipping reduces inventory&#x27;,&#x27;DC → customer: shipment and delivery&#x27;),
        B(&#x27;Safety stock setting&#x27;,&#x27;Replenishment orders&#x27;,&#x27;+&#x27;,0,&#x27;The raised setting is sent as orders&#x27;,&#x27;SCM → plant: replenishment orders [memo 3]&#x27;),
        B(&#x27;Inventory&#x27;,&#x27;Replenishment orders&#x27;,&#x27;-&#x27;,0,&#x27;More inventory, less replenishment&#x27;,&#x27;DC → SCM: inventory and stockouts&#x27;),
        B(&#x27;Replenishment orders&#x27;,&#x27;Production&#x27;,&#x27;+&#x27;,0,&#x27;The inside of the plant is left out here (expanded in stage C)&#x27;,&#x27;SCM → plant: replenishment orders&#x27;),
        B(&#x27;Production&#x27;,&#x27;Inventory&#x27;,&#x27;+&#x27;,1,&#x27;Products take time to reach inventory&#x27;,&#x27;plant → DC: products&#x27;),

        B(&#x27;Stockouts&#x27;,&#x27;OTIF&#x27;,&#x27;-&#x27;,0,&#x27;Stockouts prevent on-time in-full delivery&#x27;,&#x27;DC → carrier → customer: shipment and delivery&#x27;),

<script>// ===== draw.io で描いたCLDを読み込む =====
// 対応：.drawio / .xml（圧縮・非圧縮），.drawio.svg（content属性に図が入っているもの）。複数ページは選べる。
async function dxInflateB64(s){const bin=Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));
  const st=new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'));const t=await new Response(st).text();try{return decodeURIComponent(t);}catch(e){return t;}}
function dxPlain(v){if(v==null)return '';const d=document.createElement('div');d.innerHTML=String(v).replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p)>/gi,'\n');return (d.textContent||'').replace(/([^\x00-\x7F])\s*\n\s*(?=[^\x00-\x7F])/g,'$1').replace(/\s+/g,' ').trim();}
// 極性：＋/−/s/o/同/逆。遅れ：‖ || // 遅れ delay
function dxPol(v){const t=(v||'').replace(/‖|\|\||\/\/|遅れ|delay/gi,' ').trim();if(/^(\+|＋|s|S|同|正)$/.test(t)||/(^|\s)[+＋](\s|$)/.test(t))return '+';if(/^(-|−|－|ー|–|o|O|逆|負)$/.test(t)||/(^|\s)[-−－–](\s|$)/.test(t))return '-';return '?';}
const dxDelay=v=>/‖|\|\||\/\/|遅れ|delay/i.test(v||'');
async function dxReadPages(text){text=text.replace(/^﻿/,'');let doc=new DOMParser().parseFromString(text,'text/xml');
  const svg=doc.querySelector('svg[content]');if(svg){doc=new DOMParser().parseFromString(svg.getAttribute('content'),'text/xml');}
  let pages=[...doc.querySelectorAll('diagram')];const out=[];
  if(!pages.length){const m=doc.querySelector('mxGraphModel');if(m)out.push({name:'ページ1',model:m});}
  for(const [i,pg] of pages.entries()){let m=pg.querySelector('mxGraphModel');if(!m&&pg.textContent.trim()){try{m=new DOMParser().parseFromString(await dxInflateB64(pg.textContent),'text/xml').querySelector('mxGraphModel');}catch(e){}}
    if(m)out.push({name:pg.getAttribute('name')||('ページ'+(i+1)),model:m});}
  return out;}
function dxParsePage(model){const raw=[...model.querySelectorAll('mxCell')].map(c=>{const uo=c.parentElement&&['UserObject','object'].includes(c.parentElement.tagName)?c.parentElement:null;
    const g=c.querySelector('mxGeometry');const pt=a=>{const p=g&&g.querySelector(`mxPoint[as="${a}"]`);return p?[+p.getAttribute('x')||0,+p.getAttribute('y')||0]:null;};
    return{id:uo?uo.getAttribute('id'):c.getAttribute('id'),par:c.getAttribute('parent'),v:uo?(uo.getAttribute('label')??uo.getAttribute('value')):c.getAttribute('value'),style:c.getAttribute('style')||'',vx:c.getAttribute('vertex')==='1',ed:c.getAttribute('edge')==='1',
      s:c.getAttribute('source'),t:c.getAttribute('target'),g:g?{x:+g.getAttribute('x')||0,y:+g.getAttribute('y')||0,w:+g.getAttribute('width')||0,h:+g.getAttribute('height')||0,rel:g.getAttribute('relative')==='1'}:null,sp:pt('sourcePoint'),tp:pt('targetPoint')};});
  const by={};raw.forEach(c=>by[c.id]=c);const isEdge=id=>by[id]&&by[id].ed;
  // 絶対座標（グループの中の部品は親の座標を足す）
  const abs=c=>{let x=c.g.x,y=c.g.y,p=by[c.par],k=0;while(p&&p.vx&&p.g&&!p.g.rel&&k++<20){x+=p.g.x;y+=p.g.y;p=by[p.par];}return[x,y];};
  const lbl={};raw.filter(c=>c.vx&&c.par&&isEdge(c.par)).forEach(c=>{lbl[c.par]=((lbl[c.par]||'')+' '+dxPlain(c.v)).trim();});   // 矢印に付けたラベル（別の部品として保存される）
  const nodes=raw.filter(c=>c.vx&&c.g&&!(c.par&&isEdge(c.par))&&!/edgeLabel/.test(c.style)&&dxPlain(c.v)).map(c=>{const [x,y]=abs(c);return{id:c.id,name:dxPlain(c.v),x,y,w:c.g.w,h:c.g.h,cx:x+c.g.w/2,cy:y+c.g.h/2};});
  const nid={};nodes.forEach(n=>nid[n.id]=n);
  const near=p=>{if(!p)return null;let best=null,bd=1e9;nodes.forEach(n=>{const dx=Math.max(n.x-p[0],0,p[0]-(n.x+n.w)),dy=Math.max(n.y-p[1],0,p[1]-(n.y+n.h));const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=n;}});return bd<=40?best:null;};
  const E=[],warn={noPol:[],loose:[],self:[]};
  raw.filter(c=>c.ed).forEach(c=>{let a=nid[c.s],b=nid[c.t];let snapped=false;if(!a&&c.sp){a=near(c.sp);snapped=!!a;}if(!b&&c.tp){b=near(c.tp);snapped=snapped||!!b;}
    const lab=[dxPlain(c.v),lbl[c.id]||''].join(' ').trim();
    if(!a||!b){warn.loose.push(`${a?a.name:'（どこにもつながっていない）'} → ${b?b.name:'（どこにもつながっていない）'}${lab?'（'+lab+'）':''}`);return;}
    if(a===b){warn.self.push(a.name);return;}
    let p=dxPol(lab);if(p==='?'){warn.noPol.push(`${a.name} → ${b.name}${lab?'（ラベル「'+lab+'」）':'（ラベルなし）'}`);p='+';}
    E.push({c:a.name,e:b.name,p,d:dxDelay(lab)||/dashPattern=1 4|delay/.test(c.style),snapped});});
  return{E,nodes,warn};}
function dxScore(r){return r.E.length*2-r.warn.noPol.length;}

// ナビ（旧 入門ツール）が書き出した draw.io（SVN・話・CLD のページ）を読む
async function nvInflate(txt){const bin=Uint8Array.from(atob(txt.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('deflate-raw');const out=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();return decodeURIComponent(out);}
const nvText=v=>{const d=document.createElement('div');d.innerHTML=(v||'').replace(/<br\s*\/?>/gi,'\n');return d.textContent.trim();};
async function nvImport(text){const doc=new DOMParser().parseFromString(text,'text/xml');const pages=[...doc.querySelectorAll('diagram')];const res={svn:null,docs:[],bridge:[],posS:{},posC:{},cld:null};
  for(const pg of pages){let model=pg.querySelector('mxGraphModel');if(!model){const x=await nvInflate(pg.textContent);model=new DOMParser().parseFromString(x,'text/xml').querySelector('mxGraphModel');}if(!model)continue;
    const name=pg.getAttribute('name')||'';if(/^参考/.test(name))continue;const cells=[...model.querySelectorAll('mxCell')];const lab={},geo={};
    cells.forEach(c=>{const uo=c.parentElement&&c.parentElement.tagName==='UserObject'?c.parentElement:null;const id=uo?uo.getAttribute('id'):c.getAttribute('id');const v=uo?uo.getAttribute('label'):c.getAttribute('value');
      if(c.getAttribute('vertex')==='1'){lab[id]=nvText(v);const g=c.querySelector('mxGeometry');if(g)geo[id]=[+g.getAttribute('x')+(+g.getAttribute('width')||0)/2,+g.getAttribute('y')+(+g.getAttribute('height')||0)/2];}});
    const edges=cells.filter(c=>c.getAttribute('edge')==='1').map(c=>{const uo=c.parentElement&&c.parentElement.tagName==='UserObject'?c.parentElement:null;return{s:lab[c.getAttribute('source')],t:lab[c.getAttribute('target')],v:nvText(uo?uo.getAttribute('label'):c.getAttribute('value')),kind:uo&&uo.getAttribute('kind'),flow:uo&&uo.getAttribute('flow'),dashed:/dashed=1/.test(c.getAttribute('style')||''),col:((c.getAttribute('style')||'').match(/strokeColor=(#[0-9A-Fa-f]{6})/)||[])[1]};}).filter(e=>e.s&&e.t);
    const isSvn=/^SVN/.test(name)||edges.some(e=>/[（(](製品|情報|お金|方針)[）)]/.test(e.v));
    const pos={};Object.entries(lab).forEach(([id,n])=>{if(geo[id])pos[n]=[geo[id][0]/1.5,geo[id][1]/1.5];});
    const pol=v=>{const m=(v||'').match(/[+＋−\-－]/);return m?NORMP(m[0]):'?';};const dl=v=>/‖|\|\||遅れ/.test(v||'');
    if(isSvn){const KC={'#1F6FB2':'製品','#55656F':'情報','#2E8B57':'お金','#7B3FA0':'方針','#C8553D':'欠落'};res.svn=edges.map(e=>{const m=e.v.match(/^(.*?)\s*[（(](製品|情報|お金|方針|欠落)[）)]\s*$/);const k=m?m[2]:(KC[(e.col||'').toUpperCase()]||'情報');const v=(m?m[1]:e.v).replace(/^[✕×]\s*/,'').replace(/\n/g,' ');return `${e.s} → ${e.t}：${v||'（中身）'}（${k}）`;}).join('\n');Object.assign(res.posS,pos);}
    else if(/^話[：:]/.test(name)){const h=name.replace(/^話[：:]\s*/,'');const tx=Object.entries(lab).find(([id,n])=>!edges.some(e=>e.s===n||e.t===n)&&n.length>8);res.docs.push(`## ${h}\n${tx?tx[1]:''}\n`+edges.map(e=>`${e.s} → ${e.t} ${pol(e.v)}${dl(e.v)?' ‖':''}`).join('\n'));Object.entries(pos).forEach(([n,p])=>{if(!res.posC[n])res.posC[n]=p;});}
    else{res.cld=edges;Object.assign(res.posC,pos);edges.filter(e=>e.kind==='補う矢印'||(!e.kind&&e.dashed)).forEach(e=>res.bridge.push(`${e.s} → ${e.t} ${pol(e.v)}${dl(e.v)?' ‖':''}${e.flow?' @ '+e.flow:''}`));}}
  if(!res.docs.length&&res.cld)res.docs.push('## draw.io のCLD\n'+res.cld.filter(e=>!(e.kind==='補う矢印'||(!e.kind&&e.dashed))).map(e=>`${e.s} → ${e.t} ${pol(e.v)}${dl(e.v)?' ‖':''}`).join('\n'));
  return res;}

function cldDocs(){const c=W('cld');if(!c)return '';const E=c.edges();return E.length?'## '+(TITLE()||'CLD')+' @ワークベンチ\n'+E.map(e=>`${e.c} → ${e.e} ${e.p==='-'?'-':'+'}${e.d?' ‖':''}`).join('\n'):'';}
function TITLE(){try{const p=W('cld').get();return p.fname||'';}catch(e){return '';}}
function projectObj(){const s=W('svn'),c=W('cld');const pos={};try{const P=c.pos();Object.keys(P||{}).forEach(k=>{if(P[k]&&P[k].x!=null)pos[k]=[Math.round(P[k].x),Math.round(P[k].y)];});}catch(e){}
  return{app:'system-analysis-workbench',ver:1,lang:LANG,saved:new Date().toISOString(),title:TITLE(),svn:s?s.get():null,svnFlows:s?s.flows():null,cld:c?c.get():null,cldDocs:cldDocs(),cldPos:pos};}
// ---- 開く：形式を見分ける
async function openFile(f){const text=await f.text();const nm=f.name||'';try{
  if(/\.(drawio|xml|svg)$/i.test(nm)||/<mxfile|<mxGraphModel|<svg/i.test(text.slice(0,500)))return openDrawio(text,nm);
  if(/\.(csv|tsv|txt)$/i.test(nm)&&!/^\s*\{/.test(text)){W('cld').importCSV(text);setTab('loop');return msg(T('opened')+nm);}
  const o=JSON.parse(text);
  if(o.app==='system-analysis-workbench'){if(o.svn)W('svn').set(o.svn);if(o.cld)W('cld').set(o.cld);syncSvn(true);setTab(o.cld&&!o.svn?'cld':'svn');return msg(T('opened')+nm);}
  if(o.kind==='svn-analyzer'||(Array.isArray(o.nodes)&&Array.isArray(o.edges))){const x=Object.assign({},o);delete x.kind;delete x.flows;delete x.svn;delete x.stage_;W('svn').set(x);syncSvn(true);setTab('svn');return msg(T('opened')+nm+'（SVN）');}
  if(o.kind==='svn-flows'&&o.flows){W('cld').setSvnFlows(o.flows);setTab('cld');W('cld').tab('m');return msg(T('opened')+nm+'（SVNの流れ）');}
  if(o.app==='cld-analyzer'||o.cm||typeof o.src==='string'){W('cld').set(o);setTab('cld');return msg(T('opened')+nm+'（CLD）');}
  if(o.kind==='svn-intro'||(o.src&&typeof o.src==='object'&&('docs' in o.src||'svn' in o.src))){importIntro(o.src,o.pos);return msg(T('opened')+nm+(LANG==='ja'?'（入門ツール／ナビ・ラボの形式を変換）':' (converted)'));}
  throw new Error('?');}catch(e){msg(T('bad')+nm+' '+e.message,false);}}
// 入門ツール（ナビ）・ラボの「自分のCLD」の形式 → SVN と 認知マップ・CLD
const NORMP=p=>{p=(p||'').trim().replace('＋','+').replace(/[－−ー‐–]/,'-');return p==='+'||p==='-'?p:/^[×xX]$/.test(p)?'x':'?';};
const ARW=/^(.+?)\s*(?:→|->|⇒)\s*(.+?)\s+([+\-＋－−×xX])\s*(‖|\|\||遅れ)?\s*$/;
function importIntro(src,pos,svnObj){const rows=[];(src.svn||'').split(/\r?\n/).forEach(l=>{l=l.trim();const m=l.match(/^(.+?)\s*(?:→|->)\s*(.+?)\s*[：:]\s*(.+?)\s*(?:[（(](製品|情報|お金|方針|欠落)[）)])?\s*$/);if(m)rows.push([m[1].trim(),m[2].trim(),m[4]||'情報',m[3].trim()]);});
  const same={};(src.same||'').split(/\r?\n/).forEach(l=>{const m=l.split(/[=＝]/);if(m.length===2&&m[0].trim()&&m[1].trim())same[m[0].trim()]=m[1].trim();});
  const depts=[];let cur=null;(src.docs||'').split(/\r?\n/).forEach(l=>{const t=l.trim();if(!t||/^#\s*変数/.test(t))return;const h=t.match(/^##\s*(.+?)(?:\s*@\s*(.+))?$/);if(h){cur={name:h[1].trim(),kind:'doc',text:'',rows:[],who:(h[2]||'').trim()};depts.push(cur);return;}
    if(!cur){cur={name:'話',kind:'doc',text:'',rows:[],who:''};depts.push(cur);}const a=t.match(ARW);if(a){const p=NORMP(a[3]);if(p==='+'||p==='-')cur.rows.push({c:a[1].trim(),e:a[2].trim(),p,d:!!a[4],why:'',who:cur.who,svn:'',svnNew:false,auto:false});}else cur.text+=(cur.text?'\n':'')+t;});
  const br={name:LANG==='ja'?'補う矢印':'Added links',kind:'bridge',text:'',rows:[]};(src.bridge||'').split(/\r?\n/).forEach(l=>{const [ar,fl]=l.trim().split(/\s*[@＠]\s*/);const a=(ar||'').match(ARW);if(!a)return;const p=NORMP(a[3]);if(p!=='+'&&p!=='-')return;br.rows.push({c:a[1].trim(),e:a[2].trim(),p,d:!!a[4],why:'',who:'',svn:(fl||'').trim(),svnNew:false,auto:false});});
  const D=depts.map(d=>({name:d.name+(d.who&&d.who!==d.name?' @'+d.who:''),kind:'doc',text:d.text,rows:d.rows}));if(br.rows.length)D.push(br);
  const uni=n=>{let k=0;while(same[n]&&k++<9)n=same[n];return n;};const seen=new Set(),lines=[];D.forEach(d=>d.rows.forEach(r=>{const c=uni(r.c),e=uni(r.e);const k=c+'|'+e;if(c===e||seen.has(k))return;seen.add(k);lines.push(`${c}, ${e}, ${r.p}${r.d?', 遅れ':''}`);}));
  if(svnObj)W('svn').loadExId(svnObj);else if(rows.length)W('svn').importRows(rows,src.title||'');
  W('cld').setCM({depts:D.length?D:[{name:'立場A',kind:'doc',text:'',rows:[]}],map:same,answer:null,choice:{},ex:null});
  const P={};const pc=pos&&pos.cld||{};Object.keys(pc).forEach(k=>{const v=pc[k];if(Array.isArray(v))P[k]={x:v[0],y:v[1]};});
  W('cld').setSrc(lines.join('\n'),P);syncSvn(true);setTab(rows.length||svnObj?'svn':'cld');if(!rows.length&&!svnObj)W('cld').tab('g');}
function loadExample(id){if(!id)return;const q={bm:'qEx',parts:'qExParts',bus:'qExBus'}[id];if(!confirm(T(q)))return;
 if(id==='bm'){W('svn').loadExId('bm');W('cld').loadCmEx('docsint');}
 else if(id==='parts'){W('svn').loadExId('parts');}
 else if(id==='bus'){importIntro(BUS_SRC,{},'bus');}
 syncSvn(true);setTab('svn');msg(T('exDone')({bm:T('exBm'),parts:T('exParts'),bus:T('exBus')}[id]));}
async function openDrawio(text,nm){let r=null;try{r=await nvImport(text);}catch(e){r=null;}
  if(r&&(r.svn||r.docs.some(d=>!/^## draw\.io のCLD/.test(d)))){
   if(r.docs.length&&r.docs.some(d=>!/^## draw\.io のCLD/.test(d))){importIntro({svn:r.svn||'',docs:r.docs.join('\n\n'),same:'',bridge:r.bridge.join('\n'),title:nm.replace(/\.(drawio|xml|svg)$/i,'')},{cld:r.posC});return msg(T('opened')+nm+(LANG==='ja'?'（SVN・話・CLD）':' (SVN, stories, CLD)'));}
   if(r.svn){const rows=[];r.svn.split(/\r?\n/).forEach(l=>{const m=l.match(/^(.+?)\s*→\s*(.+?)\s*：\s*(.+?)（(製品|情報|お金|方針|欠落)）$/);if(m)rows.push([m[1].trim(),m[2].trim(),m[4],m[3].trim()]);});if(rows.length){W('svn').importRows(rows,nm.replace(/\.(drawio|xml|svg)$/i,''));syncSvn(true);if(!r.cld){setTab('svn');return msg(T('opened')+nm+'（SVN）');}}}}
const pages=await dxReadPages(text);const parsed=pages.filter(p=>!/^参考/.test(p.name)&&!/^SVN/.test(p.name)).map(p=>Object.assign({name:p.name},dxParsePage(p.model))).filter(p=>p.E.length);
  if(!parsed.length)throw new Error(LANG==='ja'?'矢印でつながった変数が見つからない':'no linked variables found');let i=parsed.findIndex(p=>/^CLD/i.test(p.name));if(i<0)i=parsed.reduce((b,p,j)=>dxScore(p)>dxScore(parsed[b])?j:b,0);
  const P=parsed[i];const seen=new Set();const lines=[];P.E.forEach(e=>{const k=e.c+'|'+e.e;if(seen.has(k))return;seen.add(k);lines.push(`${e.c}, ${e.e}, ${e.p}${e.d?', 遅れ':''}`);});
  const pos={};P.nodes.forEach(n=>{if(!pos[n.name])pos[n.name]={x:Math.round(n.cx),y:Math.round(n.cy)};});W('cld').setSrc(lines.join('\n'),pos);setTab('loop');
  const w=P.warn;msg(`${T('opened')}${nm}（${P.name}：${LANG==='ja'?'矢印':'links'} ${lines.length}${w.noPol.length?(LANG==='ja'?`，＋−が読めず＋にした ${w.noPol.length}`:`, ${w.noPol.length} without +/− set to +`):''}${w.loose.length?(LANG==='ja'?`，つながっていない ${w.loose.length}`:`, ${w.loose.length} loose`):''}）`,!(w.noPol.length||w.loose.length));}

const HELP={ja:`<h2>システム分析ワークベンチの使い方</h2>
<p><b>役割</b>：SVN（利害関係者と価値の流れ）を描き，資料や立場ごとの認知マップを作って統合し，CLD（因果ループ図）を分析して，原因の仮説を検証する作業台。例題を読んでつながりをつかむのは<b>システム分析ナビ</b>，CLD を SD にして動かすのは<b>システム分析ラボ</b>。</p>
<table class="ht"><tr><th>タブ</th><th>すること</th><th>主に使うページ</th></tr>
<tr><td>① SVN</td><td><b>上段の左に SVN，右にマトリクス，下段に選んだ項目の情報</b>（境目をドラッグして広さを変える。ダブルクリックで戻す）。マトリクスのセル・行・列の見出し，SVN の立場・流れを選ぶと，下段の「選んだ項目」に立場の視点・関連する資料・流れとデータ・描く・直す（空きセルから流れを追加）が出る。マトリクスは 統合（MDM）／立場×立場／価値×立場／<b>上流へたどる</b>（何段で届くか）／<b>要求と背反</b>（背反の数）。段階（SVN-0／1／2）の切り替え，<b>立場の視点</b>（判断に必要な情報が届いているか），<b>資料を重ねる</b>，<b>上流へたどる</b>（3つの問いで仮説を書く），<b>要求と背反</b>，<b>流れとデータ</b>（記録している表と通る仮説），<b>マトリクス</b>（立場と価値を行・列に並べた統合マトリクス（MDM）：立場×立場，立場→価値（出），価値→立場（入），価値→価値（間接）。種類ごとの折りたたみ，CSV 書き出し），<b>描く・直す</b>（AIの下書きの取り込み，Mermaid・draw.io・SVGの書き出し）</td><td>詳細 P2・P3-1・P3-3，応用 P2</td></tr>
<tr><td>② 認知マップ</td><td><b>左に認知マップ，右に因果ループ（図とマトリクスを切り替え）</b>。いちばん上の「資料別／立場別」とカードのリストで選ぶと，そのカードの認知マップだけを表示し，その矢印を右の因果ループで色付けする。右の CLD は「認知マップから（自動）」なら統合した CLD に自動で切り替わり，③因果ループにも入る（それまでの CLD は保管し「元の CLD に戻す」で戻せる）。境目はドラッグで広さを変える。資料・立場ごとのカード（文章からルールで抽出，またはAIの出力を貼り付け），統一名，<b>補う矢印</b>（①のSVNの流れが「乗っているSVNの流れ」の一覧に自動で入る），資料を1つずつ加える段階統合 → 「統合してCLDを作る」</td><td>詳細 P3-1・P3-2，応用 P3，G</td></tr>
<tr><td>② 仮説の検証</td><td><b>1．経路を求める</b>：起点（原因）と終点（結果）を選ぶと，因果ループ上の経路と符号を一覧にし，右の図で示す。「仮説にする」で仮説に加え，「データで確かめる」でデータブラウザ（同じフォルダの v5）の「矢印の検証」に経路の矢印を並べる。その後，仮説と因果の経路 → <b>予測の固定</b> → 観測事実 → 照合表 → 影響の予測（矢印を無効にする）</td><td>詳細 P3-3・P4，R，応用 P3</td></tr>
<tr><td>② 作図チェック・書き出し</td><td>描き方の点検。SVG・PNG・CSV・JSON・Graphviz・Mermaid</td><td>全体</td></tr>
<tr><td>③ 因果ループ</td><td>左にマトリクス（＋因子，セルで＋／−，直接／間接・段数）と<b>変数の関与度</b>（どの変数に多くのループが集まるか），右に CLD（＋変数・＋矢印，ループ記号・ループ一覧）。片方を直すともう片方も変わる。②の「統合してCLDを作る」の結果はここに入る。マトリクスと図，図とループ一覧の境目はドラッグで広さを変えられる（ダブルクリックで戻す）</td><td>詳細 P3-2・P3-3，応用 P3</td></tr></table>
<h3>ファイル</h3><ul>
<li><b>例題を開く</b>（上の選択）：<b>ブルーマウンテン社</b>（①SVN-0〜2 と ②資料1〜4の認知マップ），<b>部品メーカー：受注から納品まで</b>（①の SVN だけ。②③はそのまま），<b>地域の路線バス</b>（① SVN，② 住民・バス会社・自治体・運転手の話と補う矢印，③ CLD。成長の限界の例）。</li>
<li><b>保存</b>：SVN と 認知マップ・CLD・仮説をまとめて1つのファイル（JSON）にする。作業はブラウザにも自動で残る。</li>
<li><b>開く</b>（ドラッグ＆ドロップも可）：このワークベンチの保存ファイル，旧SVNアナライザ・旧CLDアナライザの保存ファイル（作業ファイル 段階A〜D，段階1・2，CLD仮説検証-受講者版を含む），入門ツール（ナビ）・ラボの「自分のCLD」の保存ファイル（SVN と認知マップ・CLD に変換），データブラウザの「ワークベンチ用に書き出す」CSV（支持された矢印），draw.io のファイル（ナビが書き出した SVN・話・CLD のページはそのまま SVN と認知マップ・CLD に，それ以外は「CLD」という名前のページ（なければ矢印の多いページ）を CLD として読む）。</li>
<li><b>ラボへ渡す</b>：いまのCLDを，システム分析ラボで開けるファイルにする（ラボの「ファイルを開く」→「自分のCLD」に入る）。SD への変換・シミュレーションはラボで行う。</li></ul>
<p class="h">旧ツール（SVNアナライザ v1・CLDアナライザ v11）の機能は，SDへ変換（ラボの②へ移した）を除いてすべてここにある。</p>`,
en:`<h2>System Analysis Workbench</h2><p>A workbench to draw the SVN, build and integrate cognitive maps, analyze the CLD and test hypotheses. Read examples in the <b>System Analysis Navi</b>; turn a CLD into SD and simulate it in the <b>System Analysis Lab</b>.</p>
<ul>
<li><b>Open an example</b> (selector at the top): <b>Blue Mountain</b> (① SVN-0 to 2 and ② maps of documents 1-4), <b>Parts maker: order to delivery</b> (① SVN only; ② and ③ stay), <b>Local bus service</b> (① SVN, ② stories of residents, bus company, municipality and drivers with added links, ③ CLD; limits to growth).</li><li><b>① SVN</b>: stages, stakeholder view, overlay documents, trace upstream, requirements and conflicts, flows and data, an integrated matrix (MDM) of stakeholders and values with folding by value type, draw/edit and export.</li>
<li><b>② Cognitive maps, CLD and analysis</b>: cards per document/stakeholder, unified names, added links (SVN flows from ① are listed automatically), staged integration; hypothesis testing with locked predictions, drawing checks, export.</li>
<li><b>③ Causal loops</b>: the matrix (+ Factor, click cells for +/−, direct/indirect and steps) with variable involvement on the left and the CLD (loop labels, loop list) on the right, edited together.</li>
<li><b>Files</b>: Save writes one JSON with everything. Open reads workbench files, old SVN/CLD Analyzer files, Navi/Lab files, Data Browser CSV and draw.io files (Navi exports with SVN/story/CLD pages, or a CLD page). "Send to Lab" writes a file the Lab can open.</li></ul>`};

// ===== 埋め込み（Notion など）でファイルの書き出しが止められたときの逃げ道 =====
// iframe の中では，ダウンロードが黙って止められることがある。そのときは書き出す中身を画面に出し，
// コピー・draw.io で直接開く・このツールを手元に保存して開き直す，を選べるようにする。
(function(){
  const inFrame=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
  if(!inFrame)return;
  const orig=HTMLAnchorElement.prototype.click;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  async function drawioUrl(xml){try{if(typeof CompressionStream==='undefined')return null;
      const s=new Blob([encodeURIComponent(xml)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      const buf=new Uint8Array(await new Response(s).arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
      return 'https://app.diagrams.net/#R'+encodeURIComponent(btoa(bin));}catch(e){return null;}}
  function copyText(t,btn){const done=()=>{btn.textContent='コピーした ✓';};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fb());}else fb();
    function fb(){const ta=document.getElementById('dlfTa');ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){btn.textContent='上の枠を選んでコピーする';}}}
  async function show(a){let text='';try{text=await (await fetch(a.href)).text();}catch(e){}
    const name=a.getAttribute('download')||'file';const isDx=/\.(drawio|xml)$/i.test(name);const url=isDx?await drawioUrl(text):null;
    let d=document.getElementById('dlfBox');if(d)d.remove();d=document.createElement('div');d.id='dlfBox';
    d.style.cssText='position:fixed;inset:0;background:rgba(20,35,45,.55);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:inherit';
    d.innerHTML=`<div style="background:#fff;border-radius:10px;max-width:760px;width:92%;max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px;line-height:1.6;color:#1B3A4B">
      <h3 style="margin:0 0 6px;font-size:17px">ファイルの書き出し：<code style="font-size:13px">${esc(name)}</code></h3>
      <p style="margin:4px 0 10px">Notion などに埋め込まれた画面では，ブラウザがダウンロードを止めることがあります。<b>ファイルが保存されていなければ</b>，次のどれかを使ってください。</p>
      <ol style="margin:0 0 10px;padding-left:20px">
       ${isDx?`<li><b>draw.io で直接開く</b>：${url?`<a href="${url}" target="_blank" rel="noopener" style="font-weight:bold">draw.io（app.diagrams.net）で開く ↗</a>　開いた draw.io の「ファイル → 名前を付けて保存」で保存する。`:'このブラウザでは使えない。下のコピーを使う。'}</li>`:''}
       <li><b>中身をコピー</b>：<button id="dlfCopy" style="padding:3px 10px">クリップボードにコピー</button>　${isDx?'draw.io で「その他 → 編集 → 図の編集（Extras → Edit Diagram）」に貼り付ける，または':''}テキストエディタに貼り付けて <code>${esc(name)}</code> の名前で保存する。</li>
       <li><b>このツールを手元で開く</b>：Notion の右上の「ダウンロード」でこの HTML を保存し，ブラウザで開き直すと，書き出し・保存がそのまま使える（おすすめ）。</li>
      </ol>
      <textarea id="dlfTa" readonly style="width:100%;height:150px;font-family:monospace;font-size:11px;border:1px solid #C9D3D8;border-radius:6px">${esc(text)}</textarea>
      <p style="text-align:right;margin:8px 0 0"><button id="dlfTry" style="padding:4px 12px">もう一度ダウンロードを試す</button> <button id="dlfClose" style="padding:4px 14px;background:#0F7C8C;color:#fff;border:0;border-radius:5px">閉じる</button></p></div>`;
    document.body.appendChild(d);
    d.querySelector('#dlfClose').onclick=()=>d.remove();d.onclick=ev=>{if(ev.target===d)d.remove();};
    d.querySelector('#dlfCopy').onclick=ev=>copyText(text,ev.target);
    d.querySelector('#dlfTry').onclick=()=>{const b=document.createElement('a');b.href=URL.createObjectURL(new Blob([text]));b.setAttribute('download',name);document.body.appendChild(b);orig.call(b);b.remove();};}
  HTMLAnchorElement.prototype.click=function(){const dl=this.hasAttribute('download');try{orig.call(this);}catch(e){}if(dl&&/^(blob:|data:)/.test(this.href||''))show(this);};
})();


// ===== クリップボードへのコピーの逃げ道 =====
// 埋め込み（iframe）の中では navigator.clipboard が止められていて，黙って失敗することがある。
// まず古い方法（execCommand）でコピーし，だめなら新しい方法，それもだめなら手でコピーする窓を出す。
(function(){
  const C=navigator.clipboard;const orig=C&&C.writeText?C.writeText.bind(C):null;
  function legacy(t){const ae=document.activeElement;const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();try{ae&&ae.focus&&ae.focus({preventScroll:true});}catch(e){}return ok;}
  function manual(t){let d=document.getElementById('clipBox');if(d)d.remove();d=document.createElement('div');d.id='clipBox';
    d.style.cssText='position:fixed;inset:0;background:rgba(20,35,45,.55);z-index:99999;display:flex;align-items:center;justify-content:center';
    d.innerHTML='<div style="background:#fff;border-radius:10px;max-width:760px;width:92%;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px;line-height:1.6;color:#1B3A4B"><b>自動でコピーできませんでした</b><br>下の枠の中身は選んだ状態です。<b>Ctrl+C</b>（Mac は <b>⌘+C</b>）でコピーして，生成AIなどに貼り付けてください。<textarea readonly style="width:100%;height:220px;margin-top:8px;font-family:monospace;font-size:12px;border:1px solid #C9D3D8;border-radius:6px"></textarea><p style="text-align:right;margin:8px 0 0"><button style="padding:4px 14px;background:#0F7C8C;color:#fff;border:0;border-radius:5px">閉じる</button></p></div>';
    document.body.appendChild(d);const ta=d.querySelector('textarea');ta.value=t;ta.focus();ta.select();
    d.querySelector('button').onclick=()=>d.remove();d.onclick=ev=>{if(ev.target===d)d.remove();};}
  const w=function(t){t=String(t==null?'':t);if(legacy(t))return Promise.resolve();
    if(orig)return orig(t).catch(e=>{window.__clipErr=e&&(e.name+': '+e.message);manual(t);});manual(t);return Promise.resolve();};
  try{if(C){C.writeText=w;}else{Object.defineProperty(navigator,'clipboard',{value:{writeText:w},configurable:true});}}catch(e){}
})();

</script></body></html>
